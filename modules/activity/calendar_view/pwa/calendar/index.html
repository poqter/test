<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d47"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="brand-180.png"><link rel="icon" type="image/png" sizes="192x192" href="brand-192.png"><title>화랑 캘린더</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#13213c;background:white;font:15px system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 4px env(safe-area-inset-bottom)}header,nav,footer{display:flex;gap:6px;align-items:center;padding:6px}header strong{margin-right:auto;font-size:22px}button,select,input,textarea{font:inherit;color:inherit;border:1px solid #cad2df;border-radius:8px;background:white;padding:8px}button{cursor:pointer}.primary{background:#092953;color:white}#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}#weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;padding:4px}.cell{border:1px solid #e2e6ec;padding:3px;overflow:hidden}.date{background:none;border:0;padding:3px;min-width:25px}.today{background:#092953;color:white}.muted{opacity:.45}.event,.more{display:block;width:100%;font-size:11px;text-align:left;padding:2px;overflow:hidden;line-height:1.3;margin:2px 0}.event{border:0;border-left:3px solid #7c8795;background:#eef1f5}.AP{border-color:#299362}.PC{border-color:#8658b6}.TA{border-color:#3977cf}.CS{border-color:#c77424}dialog{border:0;border-radius:18px 18px 0 0;margin:auto auto 0;width:min(100%,540px);max-height:88dvh;overflow:auto;padding:16px}dialog::backdrop{background:#14243870}form{display:grid;gap:9px}label{display:grid;gap:3px;font-size:13px}details label{margin:7px 0}footer{position:sticky;bottom:0;background:white;justify-content:flex-end}#msg{margin:0 8px;font-size:13px}#agenda button{display:block;width:100%;text-align:left;margin-bottom:6px}#gate{text-align:center;padding:15vh 16px}#gate a{display:inline-block;padding:12px;color:#133965} [hidden]{display:none!important}
</style><main><header><strong id="month">화랑 캘린더</strong><button id="prev">‹</button><button id="now">오늘</button><button id="next">›</button></header><nav><select id="scope"><option value="my">내 일정</option><option value="branch">지점 일정</option></select><button id="trash">삭제한 일정</button><button id="logout" hidden>로그아웃</button><button id="install" hidden>홈 화면에 설치</button><button id="restore" hidden>작성 이어가기</button></nav><details id="summary" hidden><summary id="summaryTitle"></summary><div id="summaryList"></div></details><button id="empty" hidden></button><p id="msg" role="status"></p><section id="gate" hidden><strong>화랑 캘린더</strong><p>화랑 WORKSPACE 아이디로 로그인하세요. 개인 기기에서는 30일간 로그인을 유지할 수 있습니다.</p><a target="_top" href="https://hwarang-workspace.streamlit.app/?view=mobile-calendar">WORKSPACE 아이디로 로그인</a></section><div id="weekdays"></div><div id="grid"></div></main>
<dialog id="sheet"><form id="form"><strong id="heading">내 일정에 등록</strong><label>날짜<input name="day" type="date" required></label><label>일정명<input name="title" maxlength="200" required></label><label>활동 종류<select name="kind"></select></label><label>시간<select name="timing"><option>시간 미정</option><option>시간 지정</option><option>종일</option></select></label><div id="times" hidden><label>시작<input name="start" type="time"></label><label>종료<input name="end" type="time"></label></div><details><summary>추가 정보</summary><label>동행자<select name="companion"></select></label><label>장소<input name="place"></label><label>메모<textarea name="note"></textarea></label><label>상태<select name="status"><option>예정</option><option>완료</option><option>연기</option><option>취소</option></select></label></details><span id="error" role="alert"></span><footer><button type="button" id="deleteEvent" hidden>일정 삭제</button><button type="button" id="close">닫기</button><button class="primary" id="save">저장</button></footer></form></dialog>
<dialog id="list"><h3 id="listTitle"></h3><section id="agenda"></section><footer><button id="hideList">닫기</button></footer></dialog><script src="app.js"></script></html>
