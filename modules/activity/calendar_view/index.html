</style><header><div class="nav" id="nav"></div><div class="tools" id="tools"></div></header><div class="legend" aria-label="활동 종류별 색상"><span data-kind="TA">TA 고객 연락</span><span data-kind="AP">AP 초회 상담</span><span data-kind="PC">PC 프레젠테이션 / 클로징</span><span data-kind="CS">CS 고객 관리</span></div><div id="refreshing" class="refreshing" role="status" aria-live="polite"></div><div id="grid" class="grid"></div><section class="agenda" id="agenda"></section><script>
const post=(type,data)=>parent.postMessage({isStreamlitMessage:true,type,...data},location.origin);
const emit=(action,value)=>post('streamlit:setComponentValue',{value:{action,value,anchor:selected,nonce:crypto.randomUUID()},dataType:'json'});
function el(tag,text,cls){let x=document.createElement(tag);x.textContent=text||'';x.className=cls||'';return x}
function button(label,fn,cls,aria){let b=el('button',label,cls);b.onclick=fn;if(aria)b.setAttribute('aria-label',aria);return b}
const date=s=>new Date(s+'T12:00:00Z'), iso=d=>d.toISOString().slice(0,10), add=(d,n)=>new Date(+d+n*86400000);
let selected,context,latest,lastRender,refreshNonce;
const isWeekend=s=>[0,6].includes(date(s).getUTCDay());
function weekday(s,direction=1){while(isWeekend(s))s=iso(add(date(s),direction));return s}
// Reconcile keyed dates/events instead of replacing the calendar on every refresh.
// Keeping existing nodes preserves scroll, keyboard focus and opened details.
function syncNode(old,fresh){
 if(old.nodeType!==fresh.nodeType||old.nodeName!==fresh.nodeName){old.replaceWith(fresh);return fresh}
 if(old.nodeType===3){if(old.data!==fresh.data)old.data=fresh.data;return old}
 for(const a of [...old.attributes])if(!fresh.hasAttribute(a.name)&&!(old.tagName==='DETAILS'&&a.name==='open'))old.removeAttribute(a.name);
 for(const a of [...fresh.attributes])if(!(old.tagName==='DETAILS'&&a.name==='open')&&old.getAttribute(a.name)!==a.value)old.setAttribute(a.name,a.value);
 old.onclick=fresh.onclick;old.onchange=fresh.onchange;
 if(old.tagName==='SELECT')old.value=fresh.value;

 return old;
}
function syncChildren(old,fresh){
 const keyed=new Map([...old.children].filter(n=>n.dataset.key).map(n=>[n.dataset.key,n]));
 let i=0;
 for(const child of [...fresh.childNodes]){
   const key=child.nodeType===1?child.dataset.key:null;
   let match=key?keyed.get(key):old.childNodes[i];
   if(match&&((!key&&match.nodeType===1&&match.dataset.key)||match.nodeName!==child.nodeName))match=null;
   if(match){if(old.childNodes[i]!==match)old.insertBefore(match,old.childNodes[i]||null);syncNode(match,child)}
   else old.insertBefore(child,old.childNodes[i]||null);
   i++;
 }
 while(old.childNodes.length>i)old.lastChild.remove();
}
function openMobile(session){
 const path=new URL('./pwa/calendar/index.html',location.href);
 const child=window.open(path.href,'_blank');
 if(!child)return;
 const ready=e=>{if(e.origin===location.origin&&e.source===child&&e.data?.type==='hwarang.calendar.ready'){
 child.postMessage({type:'hwarang.calendar.session',session},location.origin);removeEventListener('message',ready)}};
 addEventListener('message',ready);setTimeout(()=>removeEventListener('message',ready),30000);
}
function render(a){
 latest=a;configureSync(a);
 document.body.classList.toggle("mobile-shell",!!a.hideMobileApp);
 const {mode,day,today,events}=a,hide=a.hideWeekends!==false,anchor=date(day),month=mode==='월간',key=mode+day;
 if(context!==key){
   selected=day;
   if(!context){try{const saved=JSON.parse(sessionStorage.getItem('hwarang.calendar.selection.'+a.mobileSession?.uid)||'null');if(saved?.context===key&&/^\d{4}-\d{2}-\d{2}$/.test(saved.selected))selected=saved.selected}catch{}}
   context=key;
 }
 if(hide&&isWeekend(selected)){const candidate=weekday(selected,-1);selected=month&&candidate.slice(0,7)!==day.slice(0,7)?weekday(selected):candidate}
 const signature=JSON.stringify([mode,day,today,events,a.roster,hide,selected]);
 if(!syncFailed)document.querySelector('#refreshing').textContent='';
 if(signature===lastRender)return;
 lastRender=signature;
 const nav=el('div'),tools=el('div'),grid=el('div'),agenda=el('section');
 if(document.querySelector('dialog'))document.querySelector('dialog').close();
 const weekStart=add(anchor,-((anchor.getUTCDay()+6)%7)),weekEnd=add(weekStart,hide?4:6);
 const fmt=s=>Number(s.slice(5,7))+'월 '+Number(s.slice(8))+'일';
 const choose=s=>{
   if(hide)s=weekday(s);
   const local=month?s.slice(0,7)===day.slice(0,7):s>=(a.rangeStart||iso(weekStart))&&s<=(a.rangeEnd||iso(weekEnd));
   if(!local){emit('date',s);return}
   selected=s;try{sessionStorage.setItem('hwarang.calendar.selection.'+a.mobileSession?.uid,JSON.stringify({context,selected}))}catch{}render(a);
 };
 const move=sign=>{let d=anchor;if(month){d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+sign,1,12))}else d=add(mode==='날짜별'?date(selected):d,sign*(mode==='주간'?7:1));choose(hide&&mode==='날짜별'?weekday(iso(d),sign):iso(d))};
 nav.append(el('h2',month?anchor.getUTCFullYear()+'년 '+(anchor.getUTCMonth()+1)+'월':mode==='주간'?fmt(iso(weekStart))+' – '+fmt(iso(weekEnd)):fmt(selected)+' ('+'일월화수목금토'[date(selected).getUTCDay()]+')'),button('‹',()=>move(-1),'','이전 기간'),button('오늘',()=>{if(hide&&isWeekend(today)){selected=today;emit('weekends',false)}else choose(today)}),button('›',()=>move(1),'','다음 기간'));
 let sw=el('div','','switch');for(let m of ['날짜별','주간','월간']){let b=button(m,()=>emit('mode',m),mode===m?'active':'');b.setAttribute('aria-pressed',String(mode===m));sw.append(b)}
 let weekend=button('주말 제외',()=>{const updated={...a,hideWeekends:!hide};render(updated);emit('weekends',!hide)},'weekend-toggle');weekend.setAttribute('aria-pressed',String(hide));weekend.title='토요일·일요일 표시를 켜거나 끕니다. 일정은 삭제되지 않습니다.';
 if(!a.hideMobileApp)tools.append(button('모바일 앱 열기',()=>openMobile(latest.mobileSession)));
 if(a.hideMobileApp){
   const select=el('select');select.setAttribute('aria-label','캘린더 보기');
   for(const m of ['날짜별','주간','월간']){const o=el('option',m);o.value=m;select.append(o)}select.value=mode;select.onchange=()=>emit('mode',select.value);
   const settings=el('details','','view-settings');settings.append(el('summary','보기 설정'),weekend);
   const guide=el('details');guide.append(el('summary','활동 색상 안내'),document.querySelector('.legend').cloneNode(true));settings.append(guide);
   tools.append(select,settings);
 }else tools.append(sw,weekend,button('＋ 일정 등록',()=>emit('new',selected),'primary'));
 grid.hidden=mode==='날짜별';
 grid.className='grid'+(hide?' weekends-off':'')+(mode==='주간'?' week':'')+(mode==='날짜별'?' strip':'');
 if(!grid.hidden){
 for(let w of (hide?'월화수목금':'월화수목금토일'))grid.append(el('div',w,'weekday'));
 const first=month?date(day.slice(0,7)+'-01'):anchor, monday=add(first,-((first.getUTCDay()+6)%7)),last=new Date(Date.UTC(anchor.getUTCFullYear(),anchor.getUTCMonth()+1,0,12));
 let cells=month?Math.ceil(((first.getUTCDay()+6)%7+last.getUTCDate())/7)*7:7;
 for(let i=0;i<cells;i++){let d=add(monday,i),s=iso(d);if(hide&&isWeekend(s))continue;let items=events.filter(e=>e.day===s),box=el('div','','cell'+(s===selected?' selected':'')+(month&&s.slice(0,7)!==day.slice(0,7)?' outside':''));
 box.dataset.key=s;
 const openDay=()=>{if(month&&!a.hideMobileApp&&matchMedia("(max-width:650px)").matches){selected=s;emit("new",s)}else choose(s)};box.onclick=openDay;let num=button(String(d.getUTCDate()),ev=>{ev.stopPropagation();openDay()},'day'+(s===today?' today':''),s+' 일정 보기');if(mode==='주간')num.textContent=fmt(s)+' ('+'일월화수목금토'[d.getUTCDay()]+')';box.append(num);
 if(mode==='날짜별'&&items.length)box.append(el('span','•','daydot'));
 if(mode!=='날짜별'){for(let item of (month&&items[0]?.allDay&&items.some(e=>!e.allDay)?[items[0],items.find(e=>!e.allDay)]:items.slice(0,2))){let b=button(item.short,ev=>{ev.stopPropagation();selected=item.day;emit('event',item.id)},'chip'+(item.done?' done':''),item.label);b.dataset.key=item.id;b.dataset.kind=item.kind;b.title=item.label;box.append(b)}if(items.length>2)box.append(button('+'+(items.length-2)+'건 더보기',ev=>{
 ev.stopPropagation();choose(s);let panel=el('dialog');panel.setAttribute('aria-label',fmt(s)+' 전체 일정');document.body.append(panel);
 panel.append(button('닫기',()=>panel.close()),el('h3',fmt(s)+' 전체 일정 · '+items.length+'건'));
 for(const item of items)panel.append(button(item.label,()=>{panel.close();emit('event',item.id)},'row'));
 panel.onclose=()=>{panel.remove();document.querySelector('.selected .more')?.focus()};panel.showModal()
 },'more'))}
 grid.append(box)}
 }

 const list=events.filter(e=>e.day===selected);if(mode==='날짜별'&&Object.keys(a.roster||{}).length){
 const group=el('details');group.open=!matchMedia('(max-width:650px)').matches;group.append(el('summary','구성원별 일정 · '+Object.keys(a.roster).length+'명'));
 for(const [uid,name] of Object.entries(a.roster)){const own=list.filter(e=>e.member===uid);group.append(el('div',name+' · '+(own.map(e=>e.short.split(' · ')[0]).join(' / ')||'일정 없음'),'memberline'))}
 agenda.append(group)
 }
 agenda.append(el('h3',Number(selected.slice(5,7))+'월 '+Number(selected.slice(8))+'일 일정 · '+list.length+'건'));
 for(let item of (mode!=='날짜별'&&list.length>2?list.slice(0,2):list)){let row=button(item.label+'  ›',()=>emit('event',item.id),'row');row.dataset.key=item.id;row.dataset.kind=item.kind;agenda.append(row)}
 if(!list.length)agenda.append(el('p','등록된 일정이 없습니다.','hint'),button('이 날짜에 일정 등록',()=>emit('new',selected)));
 for(const [id,fresh] of [['nav',nav],['tools',tools],['grid',grid],['agenda',agenda]]){
   const old=document.getElementById(id);
   if(id==='grid'){old.className=fresh.className;old.hidden=fresh.hidden}
   syncChildren(old,fresh);
 }
}

// Small version probe: no schedule payload, no Streamlit rerun without a change.
let syncConfig=null,syncKey='',syncStamp=null,syncTimer=null,syncBusy=false,syncFailed=false,parentVisible=true,pendingRefresh=false,refreshAt=0,failures=0;
function configureSync(a){
 const key=JSON.stringify([a.mobileSession?.uid,a.syncUnit,a.rangeStart,a.rangeEnd]);
 syncConfig=a;
 if(key!==syncKey||a.syncStamp!==syncStamp){syncKey=key;syncStamp=a.syncStamp;}
 pendingRefresh=false;
 if(!syncTimer)scheduleSync();
}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(checkSync,Math.min(60000,15000*Math.pow(2,Math.min(failures,2)))+Math.random()*3000)}
function requestRefresh(action='refresh'){if(pendingRefresh&&Date.now()-refreshAt<20000)return;pendingRefresh=true;refreshAt=Date.now();emit(action,null);}
async function checkSync(){
 clearTimeout(syncTimer);syncTimer=null;
 if(syncBusy)return;
 const a=syncConfig,session=a?.mobileSession;
 if(document.hidden||!parentVisible||!session?.token||!a?.syncUnit){scheduleSync();return}
 syncBusy=true;const key=syncKey;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);
 try{
 const response=await fetch(session.url+'/rest/v1/rpc/sales_calendar_stamp',{method:'POST',headers:{apikey:session.key,Authorization:'Bearer '+session.token,'Content-Type':'application/json'},body:JSON.stringify({first_day:a.rangeStart,last_day:a.rangeEnd,p_unit:a.syncUnit}),signal:controller.signal});
 if(!response.ok){if(response.status===401)requestRefresh('reauth');throw Error('connection')}
 const stamp=await response.json();
 if(key!==syncKey)return;
 if(typeof stamp!=='string'){requestRefresh();throw Error('permission')}
 failures=0;syncFailed=false;document.querySelector('#refreshing').textContent='';
 if(stamp!==syncStamp)requestRefresh();
 }catch{failures++;syncFailed=true;document.querySelector('#refreshing').textContent='연결 확인 중 · 현재 표시된 일정은 유지됩니다';}
 finally{clearTimeout(timeout);syncBusy=false;scheduleSync()}
}
addEventListener('online',()=>checkSync());
addEventListener('visibilitychange',()=>{if(!document.hidden)checkSync()});
new ResizeObserver(()=>post('streamlit:setFrameHeight',{height:document.documentElement.offsetHeight+2})).observe(document.body);
addEventListener('message',e=>{
 if(e.source!==parent||e.origin!==location.origin)return;
 if(e.data.type==='streamlit:render')render(e.data.args);
 if(e.data.type==='hwarang.activity.new')emit('new',selected);
 if(e.data.type==='hwarang.activity.visibility'){parentVisible=e.data.visible;if(parentVisible)checkSync();}
 if(e.data.type==='hwarang.activity.changed'&&e.data.nonce!==refreshNonce){
   refreshNonce=e.data.nonce;requestRefresh();
 }
});
post('streamlit:componentReady',{apiVersion:1});
