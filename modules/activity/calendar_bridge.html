<!doctype html><script type="text/plain" id="calendar-layout-source">
(()=>{
 const w=window,d=w.document;
 if(w.__hwarangCalendarLayout)return;
 w.__hwarangCalendarLayout=true;
 let hadDialog=false,queued=false;
 const update=()=>{
  queued=false;
  if(!d.querySelector('.st-key-mobile_header'))return;
  const dialog=d.querySelector('[role="dialog"]:has(.sales-dialog-marker)');
  const height=w.visualViewport?.height||w.innerHeight;
  d.documentElement.style.setProperty('--sales-viewport',height+'px');
  if(hadDialog&&!dialog&&Number.isFinite(w.__calendarReturnScroll)){
   const top=w.__calendarReturnScroll;
   w.requestAnimationFrame(()=>w.requestAnimationFrame(()=>{
    const main=d.querySelector('[data-testid="stMain"]');if(main)main.scrollTop=top;
   }));
  }
  hadDialog=!!dialog;
  for(const pop of d.querySelectorAll('[data-testid="stPopoverBody"]')){
   if(pop.querySelector('.calendar-panel-close'))continue;
   if(!pop.querySelector('.mobile-drawer,.sales-reference'))continue;
   const close=d.createElement('button');close.className='calendar-panel-close';close.textContent='×';close.setAttribute('aria-label','패널 닫기');
   close.style.cssText='float:right;min-width:44px;min-height:44px;border:0;background:transparent;font-size:24px;cursor:pointer';
   close.onclick=()=>{
    const trigger=d.querySelector('[aria-expanded="true"][aria-controls="'+pop.id+'"]')||d.querySelector('[data-testid="stPopover"] button[aria-expanded="true"]');
    if(trigger)trigger.click();else pop.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
   };pop.prepend(close);
  }
  const handheld=/Android|iPhone|iPad|iPod/i.test(w.navigator.userAgent)||(w.navigator.maxTouchPoints>1&&/Macintosh/i.test(w.navigator.userAgent));
  d.documentElement.classList.toggle('hwarang-handheld',handheld);
  // Cloud chrome may be mounted in the same-origin outer host, outside the app iframe.
  let target=w;
  for(let i=0;i<5;i++){
   try{
    const doc=target.document;doc.documentElement.classList.toggle('hwarang-handheld',handheld);
    if(!doc.getElementById('hwarang-handheld-chrome')){
     const style=doc.createElement('style');style.id='hwarang-handheld-chrome';
     style.textContent='.hwarang-handheld [data-testid="stAppToolbar"],.hwarang-handheld [data-testid="stToolbar"],.hwarang-handheld [data-testid="stStatusWidget"],.hwarang-handheld [data-testid="stMainMenu"],.hwarang-handheld [data-testid="manage-app-button"],.hwarang-handheld .viewerBadge_container__r5tak,.hwarang-handheld [class*="viewerBadge"],.hwarang-handheld [class*="profilePreview"],.hwarang-handheld a:has([data-testid="appCreatorAvatar"]){display:none!important;pointer-events:none!important}';doc.head.append(style);
    }
    if(target.parent===target)break;target=target.parent;
   }catch{break}
  }
 };
 new w.MutationObserver(()=>{if(!queued){queued=true;w.requestAnimationFrame(update)}}).observe(d.body,{childList:true,subtree:true});
 w.visualViewport?.addEventListener('resize',update);
 d.addEventListener('visibilitychange',()=>{
  d.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'hwarang.activity.visibility',visible:!d.hidden},w.location.origin));
 });
 // A single same-document guard catches Android/browser Back without logging
 // every date or field change. Existing dialog/draft handlers own navigation.
 const key='hwarangCalendarBack';let exiting=false,busyUntil=0;
 let host=w;try{while(host.parent!==host&&host.parent.location.origin===w.location.origin)host=host.parent;}catch{}
 const active=()=>!!d.querySelector('.st-key-mobile_header');
 const arm=()=>{
  if(!exiting&&active()&&!host.history.state?.[key])host.history.pushState({...host.history.state,[key]:true},'',host.location.href);
 };
 const back=()=>{
  if(exiting||!active())return;
  arm();
  if(Date.now()<busyUntil)return;
  busyUntil=Date.now()+350;
  const focused=d.activeElement;
  if(w.visualViewport&&w.innerHeight-w.visualViewport.height>120&&focused?.matches('input,textarea,[contenteditable="true"]')){focused.blur();return;}
  // An already-visible unsaved-change prompt is kept; Back never discards it.
  if(d.querySelector('.st-key-sales_keep,.st-key-mobile_continue'))return;
  const dialog=d.querySelector('[role="dialog"]:has(.sales-dialog-marker)');
  if(dialog){dialog.querySelector('.st-key-sales_close_top button')?.click();return;}
  const reference=d.querySelector('[data-testid="stPopoverBody"]:has(.sales-reference) .calendar-panel-close');
  if(reference){reference.click();return;}
  const drawer=d.querySelector('[data-testid="stPopoverBody"] .mobile-drawer')&&d.querySelector('.st-key-mobile_menu_toggle button');
  if(drawer){drawer.click();return;}
  for(const iframe of d.querySelectorAll('iframe')){
   try{
    const child=iframe.contentDocument;
    const panel=child?.querySelector('dialog[open]');
    if(panel){panel.close();return;}
    const settings=child?.querySelector('.view-settings[open]');
    if(settings){settings.open=false;return;}
   }catch{}
  }
  const state=d.querySelector('.mobile-navigation-state');
  if(state&&(state.dataset.page!=='캘린더'||Number(state.dataset.depth)>0)){
   d.querySelector('.st-key-mobile_history_back button')?.click();return;
  }
  if(d.getElementById('calendar-exit-confirm'))return;
  const prompt=d.createElement('dialog');prompt.id='calendar-exit-confirm';
  prompt.setAttribute('aria-label','캘린더 나가기');
  prompt.style.cssText='border:1px solid #d8e1e8;border-radius:16px;padding:24px;max-width:calc(100vw - 32px);width:340px;color:#18334c;background:white;';
  const message=d.createElement('p');message.textContent='화랑 캘린더를 나가시겠습니까?';
  const stay=d.createElement('button');stay.textContent='계속 사용';
  const leave=d.createElement('button');leave.textContent='나가기';
  for(const button of [stay,leave])button.style.cssText='min-height:44px;padding:8px 16px;margin:8px 8px 0 0;border:1px solid #cad2df;border-radius:8px;background:white;color:#18334c;font:inherit';
  stay.onclick=()=>prompt.close();
  leave.onclick=()=>{exiting=true;prompt.close();host.history.go(host.history.length>2?-2:-1)};
  prompt.onclose=()=>prompt.remove();prompt.append(message,stay,leave);d.body.append(prompt);prompt.showModal();stay.focus();
 };
 host.addEventListener('popstate',back);
 // Re-arm from a user interaction too: mobile browsers may skip synthetic
 // history entries created before the document received user activation.
 d.addEventListener('pointerdown',event=>{
  arm();for(const frame of d.querySelectorAll('iframe')){try{const settings=frame.contentDocument?.querySelector('.view-settings[open]');if(settings)settings.open=false}catch{}}
 },true);
 d.addEventListener('keydown',arm,true);
 new w.MutationObserver(arm).observe(d.body,{childList:true,subtree:true});
 arm();
 update();
})();
</script><script>
// The bridge iframe is recreated by Streamlit. Install in the persistent app realm.
const script=parent.document.createElement("script");
script.textContent=document.getElementById("calendar-layout-source").textContent;
parent.document.head.append(script);script.remove();
</script>
