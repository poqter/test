name: HWARANG Keep Alive

on:
  # KST 00:17 / 06:17 / 12:17 / 18:17 (UTC 15:17 / 21:17 / 03:17 / 09:17)
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hwarang-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
      options: --init --ipc=host
    timeout-minutes: 12

    env:
      WORKSPACE_URL: https://hwarang-workspace.streamlit.app
      CALCULATOR_URL: https://hwarang-calculator.streamlit.app
      ACADEMY_KEEPALIVE_ENABLED: ${{ vars.ACADEMY_KEEPALIVE_ENABLED || 'false' }}
      ACADEMY_URL: https://hwarang-academy.streamlit.app
      CALENDAR_URL: https://hwarang-calendar.streamlit.app
      SUPABASE_KEEPALIVE_ENABLED: ${{ vars.SUPABASE_KEEPALIVE_ENABLED || 'false' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install keep-alive dependencies
        run: |
          python -m pip install "requests==2.34.2" "playwright==1.55.0"

      - name: Wake HWARANG services
        run: python .github/scripts/hwarang_keepalive.py
