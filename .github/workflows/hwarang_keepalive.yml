name: HWARANG Keep Alive

on:
  # Every three hours at :17 KST, starting at 00:17.
  schedule:
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hwarang-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
      options: --init --ipc=host
    timeout-minutes: 19

    env:
      WORKSPACE_URL: https://hwarang-workspace.streamlit.app
      CALCULATOR_URL: https://hwarang-calculator.streamlit.app
      CALENDAR_URL: https://hwarang-calendar.streamlit.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install keep-alive dependencies
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/keepalive-deps" "playwright==1.55.0"

      - name: Wake HWARANG services
        run: PYTHONPATH="$RUNNER_TEMP/keepalive-deps" python3 .github/scripts/hwarang_keepalive.py
