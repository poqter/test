name: Briefing offline checks
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/scripts/**', 'app.py', 'hwarang_academy/**', 'supabase/migrations/**', 'modules/briefing/**', 'modules/shared/**', 'modules/activity/**', 'public_reader/**', 'tests/**', 'requirements.txt', 'constraints.txt', 'STAGE1_CHANGED_FILES.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install from clean environment
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Offline Python regression
        run: python -m pytest -q
      - name: Activity browser regression (synthetic data only)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tests/activity_ui/check_calendar.py
          python tests/activity_ui/check_persistent_calendar.py
          python tests/activity_ui/check_calendar_fast.py
          python tests/activity_ui/check_home_speed.py
          python tests/activity_ui/check_calendar_loading.py
          python tests/activity_ui/check_entry_routes.py
          python tests/activity_ui/check_calendar_entry.py
          python tests/activity_ui/check_install.py
          python tests/activity_ui/check_workspace.py
          python tests/activity_ui/check_manager.py
          python tests/activity_ui/check_daily.py
          python tests/activity_ui/check_mobile.py
          python tests/activity_ui/check_mobile_back.py
          python tests/activity_ui/check_mobile_back_host.py
          python tests/activity_ui/check_shell.py
          python tests/activity_ui/check_legacy_calendar.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Academy learning authorization and persistence regression
        run: |
          npm ci --ignore-scripts --prefix tests/studio_db
          node tests/studio_db/check.mjs
          node tests/activity_db.mjs
      - name: Customer reader HTTP regression
        run: node --test tests/test_briefing_public.mjs
  deployed-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify deployed release and workspace entry
        run: python .github/scripts/verify_briefing_deployment.py
