name: Briefing offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('selective-ci-pr-{0}', github.event.pull_request.number) || format('selective-ci-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
      options: --init --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine required checks
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/scripts/select_ci.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install from clean environment
        if: ${{ steps.select.outputs.any == 'true' }}
        id: python_setup
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Prepare browser checks
        if: ${{ steps.select.outputs.browser == 'true' }}
        id: browser_setup
        run: python -m pip install playwright==1.55.0
      - name: Show configured keep-alive targets without visiting services
        if: ${{ steps.select.outputs.keepalive == 'true' }}
        env:
          ACADEMY_KEEPALIVE_ENABLED: ${{ vars.ACADEMY_KEEPALIVE_ENABLED || 'false' }}
        run: python -c "import runpy; targets = runpy.run_path('.github/scripts/hwarang_keepalive.py')['scheduled_targets'](); print(', '.join(target.name for target in targets))"
      - name: Operations console desktop and mobile regression
        if: ${{ steps.select.outputs.operations == 'true' }}
        run: |
          mkdir -p test-results/operations
          OPS_SCREENSHOTS=test-results/operations python tests/check_operations_browser.py
      - name: Preserve synthetic operations screenshots
        if: ${{ always() && steps.select.outputs.operations == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: operations-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/operations/
          retention-days: 7
          if-no-files-found: ignore
      - name: Offline Python regression
        if: ${{ !cancelled() && steps.select.outputs.python == 'true' && steps.python_setup.outcome == 'success' }}
        run: python -m pytest -q
      - name: Activity browser regression (synthetic data only)
        if: ${{ !cancelled() && steps.select.outputs.activity == 'true' && steps.browser_setup.outcome == 'success' }}
        run: python tests/activity_ui/run_checks.py
      - name: PDF editor browser regression (synthetic files only)
        if: ${{ steps.select.outputs.pdf == 'true' }}
        run: python tests/pdf_tools/check_browser.py
      - name: WebKit mobile navigation and device simulation
        if: ${{ !cancelled() && steps.select.outputs.activity == 'true' && steps.browser_setup.outcome == 'success' }}
        run: |
          HW_TEST_BROWSER=webkit python tests/activity_ui/run_checks.py check_mobile_menu.py check_mobile_back.py check_calendar_devices.py
      - name: Preserve synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/activity-ui/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/setup-node@v6
        if: ${{ !cancelled() && steps.select.outputs.node == 'true' }}
        with:
          node-version: 22
      - name: Install CBT and learning DB dependencies
        if: ${{ !cancelled() && steps.select.outputs.academy == 'true' }}
        id: exam_deps
        run: npm ci --ignore-scripts --prefix tests/exams
      - name: CBT database and cancellation regression
        if: ${{ !cancelled() && steps.select.outputs.academy == 'true' }}
        run: |
          node tests/exams/database.mjs
          python tests/exams/workspace_flow.py
      - name: FP course and new profile after simulator retirement
        if: ${{ !cancelled() && steps.select.outputs.academy == 'true' && steps.exam_deps.outcome == 'success' }}
        run: node tests/foundation_db.mjs
      - name: Install synthetic DB dependencies
        if: ${{ !cancelled() && (steps.select.outputs.academy == 'true' || steps.select.outputs.activity == 'true') }}
        id: synthetic_db
        run: npm ci --ignore-scripts --prefix tests/studio_db
      - name: Academy learning authorization and persistence regression
        if: ${{ !cancelled() && steps.select.outputs.academy == 'true' }}
        run: node tests/studio_db/check.mjs
      - name: Calendar database regression
        if: ${{ !cancelled() && steps.select.outputs.activity == 'true' && steps.synthetic_db.outcome == 'success' }}
        run: |
          node tests/calendar_empty_day.mjs
          node tests/calendar_widget.mjs
          node tests/activity_db.mjs
          node tests/calendar_scope_sync.mjs
          node tests/calendar_scope_realtime.mjs
          node tests/calendar_incremental.mjs
          node tests/calendar_loading.mjs
          node tests/calendar_navigation.mjs
          node tests/calendar_result_save.mjs
          node tests/calendar_runtime.mjs
          node tests/calendar_search.mjs
      - name: Daily record signals and manager totals
        if: ${{ !cancelled() && steps.select.outputs.activity == 'true' }}
        run: python tests/check_activity_signal_totals.py
      - name: Kakao opt-in notification security regression
        if: ${{ !cancelled() && steps.select.outputs.kakao == 'true' }}
        run: node --test tests/kakao_multi*.test.mjs
      - name: Customer reader HTTP regression
        if: ${{ !cancelled() && steps.select.outputs.reader == 'true' }}
        run: node --test tests/test_briefing_public.mjs
  deployed-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    concurrency:
      group: streamlit-deployment-verification
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
      options: --init --ipc=host
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - name: Verify WORKSPACE version and login entry
        run: python .github/scripts/verify_briefing_deployment.py workspace
      - name: Verify CALCULATOR version
        run: python .github/scripts/verify_briefing_deployment.py calculator

