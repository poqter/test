name: Briefing offline checks
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/scripts/**', 'app.py', 'hwarang_academy/**', 'supabase/migrations/**', 'modules/briefing/**', 'modules/shared/**', 'modules/activity/**', 'modules/calculators/**', 'modules/consultation/**', 'modules/performance/**', 'data/calculator*.json', 'FINANCIAL_CALCULATORS_CATALOG.json', 'public_reader/**', 'tests/**', 'requirements.txt', 'constraints.txt', 'STAGE1_CHANGED_FILES.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
      options: --init --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install from clean environment
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Offline Python regression
        run: python -m pytest -q
      - name: Activity browser regression (synthetic data only)
        run: |
          python -m pip install playwright==1.55.0
          python tests/activity_ui/run_checks.py
      - name: PDF editor browser regression (synthetic files only)
        run: python tests/pdf_tools/check_browser.py
      - name: WebKit mobile navigation and device simulation
        if: ${{ !cancelled() }}
        run: |
          HW_TEST_BROWSER=webkit python tests/activity_ui/run_checks.py check_mobile_menu.py check_mobile_back.py check_calendar_devices.py
      - name: Preserve synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/activity-ui/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/setup-node@v6
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - name: CBT database and cancellation regression
        if: ${{ !cancelled() }}
        run: |
          npm ci --ignore-scripts --prefix tests/exams
          node tests/exams/database.mjs
      - name: Academy learning authorization and persistence regression
        if: ${{ !cancelled() }}
        run: |
          npm ci --ignore-scripts --prefix tests/studio_db
          node tests/studio_db/check.mjs
          node tests/activity_db.mjs
      - name: Customer reader HTTP regression
        if: ${{ !cancelled() }}
        run: node --test tests/test_briefing_public.mjs
  deployed-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
      options: --init --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - name: Verify deployed release and workspace entry
        run: python .github/scripts/verify_briefing_deployment.py

