name: Publish signed staff widget
on:
  push:
    branches: [main]
    paths: ['android/staff-releases/**', '.github/workflows/publish_staff_widget.yml']
  pull_request:
    paths: ['android/staff-releases/**', '.github/workflows/publish_staff_widget.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify staff APK signature and identity
        run: |
          apk=android/staff-releases/0.2.4/hwarang-month-widget.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$apk" | grep -Fxi 'Signer #1 certificate SHA-256 digest: 924513f70eb3c2ac5e535c12cd7af8fdc29a27f39642ebff2d9be9d777978569'
          "$tools/aapt" dump permissions "$apk" | grep -Fx "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='com.hwarang.calendarwidget' versionCode='6' versionName='0.2.4'"
  publish:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/staff-releases/0.2.4/hwarang-month-widget.apk
          if gh release view widget-v0.2.4 >/dev/null 2>&1; then
            gh release download widget-v0.2.4 -p hwarang-month-widget.apk -D "$RUNNER_TEMP"
            cmp "$apk" "$RUNNER_TEMP/hwarang-month-widget.apk"
          else
            gh release create widget-v0.2.4 "$apk" --target "$GITHUB_SHA" --title '화랑 월간 달력 0.2.4' --notes '일정 시간·제목을 월간 위젯에서 확인하세요. 날짜별 목록·상세·등록 화면 개편, 지점 공통 강조, WORKSPACE 아이디 연결을 지원합니다. 0.2.2 이상은 기존 앱 위에 업데이트하세요. 0.2.1 이하 시험판은 삭제 후 재설치하고 계정을 연결하세요.' --latest=false
          fi
