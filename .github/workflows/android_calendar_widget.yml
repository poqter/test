name: Android calendar widget
on:
  pull_request:
    paths: ['android/calendar-widget/**', '.github/workflows/android_calendar_widget.yml']
  push:
    branches: [main]
    paths: ['android/calendar-widget/**', '.github/workflows/android_calendar_widget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/widget-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          curl --fail --silent --show-error --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_SDK_ROOT"
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses)
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test numeric time entry
        run: |
          mkdir -p "$RUNNER_TEMP/clock-test"
          javac -d "$RUNNER_TEMP/clock-test" android/calendar-widget/src/com/hwarang/calendarwidget/Clock.java android/calendar-widget/tests/ClockTest.java
          java -cp "$RUNNER_TEMP/clock-test" com.hwarang.calendarwidget.ClockTest
      - name: Build and verify a signed internal test APK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/widget-sdk
          WIDGET_KEY_ALIAS: widget-internal
        run: |
          export WIDGET_KEYSTORE="$RUNNER_TEMP/widget-internal.p12"
          export WIDGET_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          export WIDGET_KEY_PASSWORD="$WIDGET_KEYSTORE_PASSWORD"
          keytool -genkeypair -storetype PKCS12 -keystore "$WIDGET_KEYSTORE" -storepass "$WIDGET_KEYSTORE_PASSWORD" -keypass "$WIDGET_KEY_PASSWORD" -alias "$WIDGET_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=HWARANG Internal Test'
          bash android/calendar-widget/build.sh "$RUNNER_TEMP/widget-apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hwarang-month-widget-internal-test
          path: ${{ runner.temp }}/widget-apk/hwarang-month-widget.apk
          if-no-files-found: error
          retention-days: 30

  staff-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-widget]'))
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Sign and check staff APK
        env:
          KEY_B64: ${{ secrets.WIDGET_RELEASE_KEYSTORE_BASE64 }}
          WIDGET_KEYSTORE_PASSWORD: ${{ secrets.WIDGET_RELEASE_PASSWORD }}
          WIDGET_KEY_PASSWORD: ${{ secrets.WIDGET_RELEASE_PASSWORD }}
          WIDGET_KEY_ALIAS: hwarang-widget-release
        run: |
          umask 077
          export WIDGET_KEYSTORE="$RUNNER_TEMP/widget-release.p12"
          trap 'rm -f "$WIDGET_KEYSTORE"' EXIT
          printf %s "${KEY_B64:?Missing employee release key}" | base64 -d > "$WIDGET_KEYSTORE"
          bash android/calendar-widget/build.sh "$RUNNER_TEMP/widget-release"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="$RUNNER_TEMP/widget-release/hwarang-month-widget.apk"
          "$tools/apksigner" verify --print-certs "$apk" | grep -Fxi 'Signer #1 certificate SHA-256 digest: 924513f70eb3c2ac5e535c12cd7af8fdc29a27f39642ebff2d9be9d777978569'
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='com.hwarang.calendarwidget' versionCode='13' versionName='0.2.11'"
      - name: Retain verified staff build for publication review
        uses: actions/upload-artifact@v4
        with:
          name: hwarang-staff-widget-signed
          path: ${{ runner.temp }}/widget-release/hwarang-month-widget.apk
          if-no-files-found: error
          retention-days: 1
      - name: Publish verified staff update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/widget-release/hwarang-month-widget.apk"
          if ! gh release view widget-v0.2.11 >/dev/null 2>&1; then
            gh release create widget-v0.2.11 "$apk" --target "$GITHUB_SHA" --title '화랑 월간 달력 0.2.11' --notes '일정 제목의 네 자리 시각 적용을 지원합니다.' --latest=false
          fi
