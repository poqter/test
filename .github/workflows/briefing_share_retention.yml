name: Briefing share retention
on:
  schedule:
    - cron: '15 18 * * *' # 03:15 KST, once daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/briefing_share_retention.yml'
      - '.github/scripts/cleanup_briefing_shares.py'
permissions:
  contents: read
concurrency:
  group: briefing-share-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 jsonschema==4.26.0 holidays==0.106
      - name: Delete expired copies and orphan assets
        run: python .github/scripts/cleanup_briefing_shares.py
