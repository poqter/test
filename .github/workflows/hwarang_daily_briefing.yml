name: HWARANG Daily Briefing
on:
  schedule:
    - cron: '30 21 * * *' # 06:30 KST
    - cron: '0 22 * * *'  # 07:00 KST
    - cron: '30 22 * * *' # 07:30 KST
    - cron: '0 23 * * *'  # 08:00 KST
    - cron: '10 23 * * *' # 08:10 KST, at most one recovery
    - cron: '7,27,47 22,23,0,1,2 * * *' # 07:07-11:47 KST catch-up checks
  workflow_dispatch:
    inputs:
      action:
        description: Daily operation
        required: true
        type: choice
        default: check
        options: [check, prepare, market, daily, publish, recover, catch_up]
permissions:
  contents: read
concurrency:
  group: hwarang-daily-briefing
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Same model verified in the existing Streamlit generation request.
      # Repository variables remain available for an explicit override.
      BRIEFING_DISCOVERY_MODEL: ${{ vars.BRIEFING_DISCOVERY_MODEL || 'gpt-6-luna' }}
      BRIEFING_ANALYSIS_TIMEOUT_SECONDS: ${{ vars.BRIEFING_ANALYSIS_TIMEOUT_SECONDS || '180' }}
      BRIEFING_ROUTINE_MODEL: ${{ vars.BRIEFING_ROUTINE_MODEL || vars.BRIEFING_DISCOVERY_MODEL || 'gpt-6-luna' }}
      BRIEFING_DIRECT_SOURCES_JSON: ${{ vars.BRIEFING_DIRECT_SOURCES_JSON }}
      BRIEFING_DAY_BUDGET_USD: ${{ vars.BRIEFING_DAY_BUDGET_USD }}
      BRIEFING_MONTH_BUDGET_USD: ${{ vars.BRIEFING_MONTH_BUDGET_USD }}
      BRIEFING_PRICE_TABLE_JSON: ${{ vars.BRIEFING_PRICE_TABLE_JSON }}
      BRIEFING_EXTRA_HOLIDAYS_JSON: ${{ vars.BRIEFING_EXTRA_HOLIDAYS_JSON }}
      BRIEFING_DEFAULT_NEWS_FEEDS: ${{ vars.BRIEFING_DEFAULT_NEWS_FEEDS }}
      BRIEFING_ENABLE_RESEARCH: ${{ vars.BRIEFING_ENABLE_RESEARCH }}
      SCHEDULE: ${{ github.event.schedule }}
      MANUAL_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 jsonschema==4.26.0 holidays==0.106
      - name: Run daily operation
        shell: bash
        run: |
          if [[ -n "$SCHEDULE" ]]; then
            BRIEFING_ACTION=catch_up
          else
            BRIEFING_ACTION="$MANUAL_ACTION"
          fi
          python .github/scripts/hwarang_daily_briefing.py --action "$BRIEFING_ACTION"
      - name: Save operation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: briefing-operation-status-${{ github.run_id }}
          path: briefing-operation-status.json
          retention-days: 14
          if-no-files-found: ignore
