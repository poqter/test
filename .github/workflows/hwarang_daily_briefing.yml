name: HWARANG Daily Briefing
on:
  schedule:
    - cron: '30 21 * * *' # 06:30 KST
    - cron: '0 22 * * *'  # 07:00 KST
    - cron: '30 22 * * *' # 07:30 KST
    - cron: '0 23 * * *'  # 08:00 KST
    - cron: '10 23 * * *' # 08:10 KST, at most one recovery
  workflow_dispatch:
    inputs:
      action:
        description: Daily operation
        required: true
        type: choice
        default: prepare
        options: [prepare, market, daily, publish, recover]
permissions:
  contents: read
concurrency:
  group: hwarang-daily-briefing
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRIEFING_DISCOVERY_MODEL: ${{ vars.BRIEFING_DISCOVERY_MODEL }}
      BRIEFING_ROUTINE_MODEL: ${{ vars.BRIEFING_ROUTINE_MODEL }}
      BRIEFING_DIRECT_SOURCES_JSON: ${{ vars.BRIEFING_DIRECT_SOURCES_JSON }}
      BRIEFING_MARKET_OBSERVATIONS_URL: ${{ secrets.BRIEFING_MARKET_OBSERVATIONS_URL }}
      BRIEFING_MARKET_OBSERVATIONS_JSON: ${{ vars.BRIEFING_MARKET_OBSERVATIONS_JSON }}
      SCHEDULE: ${{ github.event.schedule }}
      MANUAL_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 jsonschema==4.26.0
      - name: Run daily operation
        shell: bash
        run: |
          case "$SCHEDULE" in
            '30 21 * * *') BRIEFING_ACTION=prepare ;;
            '0 22 * * *') BRIEFING_ACTION=market ;;
            '30 22 * * *') BRIEFING_ACTION=daily ;;
            '0 23 * * *') BRIEFING_ACTION=publish ;;
            '10 23 * * *') BRIEFING_ACTION=recover ;;
            *) BRIEFING_ACTION="$MANUAL_ACTION" ;;
          esac
          python .github/scripts/hwarang_daily_briefing.py --action "$BRIEFING_ACTION"
