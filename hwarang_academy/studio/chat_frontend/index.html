<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객과 대화</title><link rel="stylesheet" href="chat.css"></head><body><section class="chat-shell"><header><div><span class="dot"></span><strong id="customer-name">상담 대화</strong><small id="chat-stage"></small></div><span id="room-state">대화 중</span></header><div id="messages" role="log" aria-label="상담 대화" aria-live="polite" aria-relevant="additions"></div><button id="new-message" hidden>새 메시지 ↓</button><div id="request-status" role="status"></div><div class="retry-controls" id="retry-controls" hidden><button id="retry">다시 보내기</button><button id="edit">문장 수정</button></div><form id="composer"><label for="message" class="sr-only">고객에게 보낼 메시지</label><textarea id="message" rows="2" maxlength="2400" placeholder="고객에게 이야기해 보세요…"></textarea><button id="send" type="submit" aria-label="메시지 보내기">보내기 ↑</button></form><footer><span>Enter 전송 · Shift+Enter 줄바꿈</span><span id="count">0 / 2400</span></footer></section><script src="chat.js"></script></body></html>
