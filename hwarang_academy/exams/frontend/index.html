<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css">
<body><div id="app"><header><div><small>HWARANG ACADEMY · 보험시험</small><h1 id="title"></h1></div><div class="time"><small id="timer-label">남은 시간</small><strong id="timer">--:--</strong></div></header>
<div class="status"><span id="progress"></span><span id="saved" role="status">저장 완료</span></div><p id="notice" role="status"></p>
<div id="failure" hidden role="alert"><span id="error"></span><button id="retry">저장 재시도</button><button id="reload">저장된 답안 불러오기</button></div>
<div class="layout"><main><section class="paper"><div class="question-head"><h2 id="number" tabindex="-1"></h2><label><input id="flag" type="checkbox"> 다시 확인</label></div><div id="question" class="prose"></div><div id="choices" role="group" aria-label="답안 선택"></div><div id="feedback" hidden></div><button id="check" class="primary" hidden>정답 확인</button></section><nav class="actions" aria-label="문제 이동"><button id="prev">← 이전</button><button id="next" class="primary">다음 →</button></nav></main>
<aside><details id="map" open><summary>답안 현황 <span id="count"></span></summary><p class="legend">● 응답 · ★ 다시 확인 · 테두리 현재 문제</p><div id="grid"></div></details><button id="finish" class="finish">시험 종료·제출</button><small>답안은 자동 저장됩니다.<br>연결이 끊겨도 시험 시간은 계속 흐릅니다.</small></aside></div>
<dialog id="confirm"><h2>제출하시겠습니까?</h2><p id="confirm-text"></p><p>제출 후 답안을 변경할 수 없습니다.</p><div class="actions"><button id="cancel">계속 풀기</button><button id="submit" class="primary">제출하기</button></div></dialog></div><script src="app.js"></script></body></html>
