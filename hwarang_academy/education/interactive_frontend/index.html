<header class="hw-top"><div class="hw-brand">HWARANG <span style="font-weight:400">ACADEMY</span></div><span class="hw-tag">교육 홈 · 검수 운영</span></header>
<div class="hw-layout"><aside><div class="hw-person"><strong>나의 성장 과정</strong><small>FP 기초 과정</small></div><nav aria-label="교육 과정"></nav><div class="hw-aside-note">최고관리자 검수용<br>일반 사용자 접근 제한 유지<br><br>저장된 학습 진도를 표시합니다.</div></aside><main></main></div>
<script>
(()=>{const root=document.getElementById('hwarang-academy-alpha'),main=root.querySelector('main'),nav=root.querySelector('nav');
const sections=[['core','핵심 교육','15'],['prep','입문 준비','2'],['mission','종합 실습','3'],['field','현장 적용','4'],['extra','선택 심화','6']];
const chapters=[['보험계약 이해','계약의 구조와 근거를 읽습니다.'],['고객과 대화 시작','필요한 질문으로 상담을 이어갑니다.'],['보장 이해','고객 상황과 보장 조건을 연결합니다.'],['분석과 제안','확인된 근거로 선택지를 비교합니다.'],['계약과 사후관리','청약 전 확인부터 사후관리까지 연결합니다.']];
const lessons=[
['보험이 해결하는 문제와 상담의 흐름','고객의 위험과 상담 목적을 연결하기','개념 + 상황 판단',50,0,['고객의 걱정 읽기','보험의 역할과 한계','상담 흐름 구성','확인할 질문 선택']],
['보험계약 한 장 읽기','역할·금액·기간을 가상 증권에서 읽기','시각 설명 + 조작',60,0,['계약의 세 역할','보험료·보험금·가입금액','납입기간·보장기간','가상 증권 종합 읽기']],
['계약 조건의 근거 찾기','주계약·특약과 적용 조건 확인하기','자료 탐색 + 비교',55,0,['주계약과 특약','갱신 여부 읽기','면책·감액 조건 찾기','적용 자료와 근거 선택']],
['첫 연락과 상담 약속','연락 목적을 밝히고 약속 조율하기','분기형 대화',50,1,['첫 연락 준비','본인과 목적 소개','고객 반응에 응답','약속과 확인사항 정리']],
['질문·경청과 고객 상황 파악','사실과 해석을 나누어 요구 정리하기','고객 인터뷰',60,1,['열린 질문과 경청','예산·우선순위 확인','사실과 추측 구분','고객 상황 요약']],
['거절·망설임과 다음 행동','고객의 망설임을 이해하고 다음 행동 선택하기','분기형 대화 + 재연습',55,1,['망설임의 이유 파악','질문으로 확인','설명과 선택지 조정','고객 뜻을 반영한 마무리']],
['치료비와 실손의 구조','진료비와 보장 조건을 함께 읽기','청구서·조건 비교',65,2,['진료비 항목 구분','실손의 역할','자기부담·제외 조건','가상 진료비 사례']],
['암·뇌·심 보장 읽기','이름이 비슷한 담보의 범위 비교하기','담보 비교 실습',70,2,['진단명과 담보명','진단비와 치료비','범위·요건 확인','유사 담보 비교']],
['수술·입원과 후유장해 구분','사건별로 필요한 근거 찾기','사례 분류 + 근거 찾기',60,2,['사건과 담보 연결','정의·분류 확인','지급 요건 읽기','추가 확인사항 구분']],
['사망·돌봄 보장과 가족의 필요','가족의 생활·부채·돌봄 필요 파악하기','가족 상황 분석',65,2,['가족의 필요 파악','사망 보장 구조','돌봄 보장 개념','질문과 확인 항목 선택']],
['가상 증권 분석','여러 계약의 사실과 미확인 항목 정리하기','증권 분석 실습',70,3,['자료 모으기','계약 정보 정리','중복·공백 검토','미확인 항목 분리']],
['유지·조정·신규안 비교','같은 기준에서 대안과 영향 비교하기','대안 비교 실습',65,3,['비교 기준 설정','기존 계약 영향','비용·조건 비교','우선순위별 대안']],
['고객이 이해하는 제안 설명','근거와 고객 반응을 반영해 설명하기','제안 대화',60,3,['설명 순서 구성','근거 연결','단정 표현 점검','고객 이해 확인']],
['청약 전 확인과 심사 안내','고지·동의·서류의 누락 확인하기','누락 찾기 + 판단',65,4,['알릴 사항 확인','심사 안내','설명·동의·서류','모호한 사례 확인']],
['보험금 청구와 계약 이후 관리','청구 문의부터 추가 안내까지 연결하기','청구·사후관리 실습',60,4,['문의 내용 확인','필요 자료 확인','접수·추가 요청','이후 관리 계획']]];
const extras={prep:[['업무 시작 준비','계정·시스템·자료·연락체계 확인','준비 체크'],['고객정보와 업무 원칙','정보 취급·전달·확인이 필요한 상황','상황 판단']],mission:[['첫 고객 만나기','연락 → 약속 → 요구 파악 → 자료 요청','미제출'],['고객의 계약 설명하기','증권 분석 → 대안 비교 → 근거 설명','미제출'],['상담을 끝까지 연결하기','새 고객의 상담부터 계약 이후까지','미제출']],field:[['시스템과 자료 직접 찾기','내 계정으로 업무 경로 확인','미기록'],['선배 상담 동행','질문·근거·고객 반응 관찰','미기록'],['동료와 말로 연습','고객 역할을 나누어 상담 연습','미기록'],['피드백 반영 확인','다음 시도에서 바뀐 행동 확인','미기록']],extra:[['실손 세대와 전환 비교','계약 시점과 전환 조건 비교','선택 심화'],['치매·간병 심화','공적 제도와 민간 보장 구분','선택 심화'],['자동차·운전자·배상책임','위험과 담보의 연결','선택 심화'],['연금·장기 자금 계획','고객의 장기 목적과 조건 확인','선택 심화'],['변액보험 이해','위험·비용·자격 확인','선택 심화'],['활동 계획과 프로스펙팅','대상·활동·최신 운영 안내','선택 심화']]};
let tab='core',selection=null,detailStep=0;
const state=i=>root.savedLabel?.('l'+String(i+1).padStart(2,'0'))||'시작 전';const completed=i=>['submitted','approved'].includes(root.savedRows?.['l'+String(i+1).padStart(2,'0')]?.status);
function wire(){main.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(Number(b.dataset.lesson)));main.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>openExtra(Number(b.dataset.extra)));main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>change(b.dataset.go));const back=main.querySelector('[data-back]');if(back)back.onclick=()=>{selection=null;render()};main.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{detailStep=Number(b.dataset.step);renderDetail()});}
function change(t){tab=t;selection=null;renderNav();render()}
function renderNav(){nav.innerHTML=sections.map(s=>`<button class="hw-nav cursor-interaction" aria-pressed="${tab===s[0]}" data-tab="${s[0]}">${s[1]}<span>${s[2]}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>change(b.dataset.tab))}
function lessonCard(l,i){return `<button class="hw-lesson cursor-interaction ${state(i)==='학습 중'?'hw-current':''}" data-lesson="${i}"><div class="hw-cardtop"><span>LESSON ${String(i+1).padStart(2,'0')}</span><span class="hw-status ${completed(i)?'good':state(i)==='학습 중'?'active':''}">${state(i)}</span></div><h3>${l[0]}</h3><div class="hw-desc">${l[1]}</div><div class="hw-bottom"><span>${l[2]}</span><span>핵심 흐름 학습</span></div></button>`}
function render(){root.active=null;if(selection!==null){renderDetail();return}if(tab==='core'){main.innerHTML=`<div class="hw-eyebrow">FP FOUNDATION</div><h1>배운 내용을, 고객 앞에서 사용할 수 있도록.</h1><p>5개 챕터 · 15개 수업 · 내 속도에 맞춰 이어가는 과정</p><section class="hw-hero"><div><div class="hw-eyebrow">직접 체험하는 수업 · CHAPTER 01</div><h2>보험계약 한 장 읽기</h2><p>역할 배치 → 금액 구분 → 기간 비교 → 새 증권 적용</p><small>선택과 실습 결과를 저장하고 이어서 학습하세요.</small></div><button class="hw-action cursor-interaction" data-lesson="1">수업 시작하기 →</button></section><div class="hw-progress"><span>입문 준비 <b>${root.prepCompleted||0} / 2</b></span><span>핵심 수업 <b>${lessons.filter((l,i)=>completed(i)).length} / 15</b></span><span>종합 실습 검토 완료 <b>${root.approvedMissions||0} / 3</b></span></div><div class="hw-feedback"><span>고객 미션 · 배운 내용을 상담 흐름으로 연결하기</span><button class="cursor-interaction" data-go="mission">미션 보기 →</button></div>${chapters.map((c,k)=>`<section class="hw-chapter"><div class="hw-heading"><div><div class="hw-eyebrow">CHAPTER 0${k+1}</div><h2>${c[0]}</h2><small>${c[1]}</small></div><small>${lessons.filter((l,i)=>l[4]===k&&completed(i)).length} / ${lessons.filter(l=>l[4]===k).length} 완료</small></div><div class="hw-grid">${lessons.map((l,i)=>l[4]===k?lessonCard(l,i):'').join('')}</div></section>`).join('')}<div class="hw-foot">현재 수업은 핵심 흐름을 압축한 초기 과정입니다. 화면의 완료 수치는 서버에 저장된 제출 결과입니다.</div>`;}else{const titles={prep:['학습을 시작할 준비','업무 환경과 기본 원칙을 먼저 확인합니다.'],mission:['고객의 상황을 끝까지 연결하기','배운 내용을 종합하여 제출하고, 관리자 피드백으로 보완합니다.'],field:['학습을 현장으로 옮기기','실제 동행과 역할 연습을 구분해 기록합니다.'],extra:['필요한 분야를 더 깊게','필수 과정과 별도로 선택하는 심화 수업입니다.']};main.innerHTML=`<div class="hw-eyebrow">${sections.find(s=>s[0]===tab)[1]}</div><h1>${titles[tab][0]}</h1><p>${titles[tab][1]}</p><div class="hw-heading"><h2>${tab==='mission'?'고객 미션':tab==='prep'?'시작 체크':tab==='field'?'현장 활동':'심화 수업'}</h2><small>${extras[tab].length}개</small></div><div class="hw-grid">${extras[tab].map((x,i)=>`<button class="hw-lesson cursor-interaction" data-extra="${i}"><div class="hw-cardtop"><span>${String(i+1).padStart(2,'0')}</span><span class="hw-status ${tab==='mission'&&root.missionRecords?.[i]?.status==='보완 필요'?'active':''}">${tab==='prep'?(root.prepStates?.[i]?'준비 완료':'준비 전'):tab==='mission'?(root.missionRecords?.[i]?.status||'미제출'):tab==='field'?(root.fieldRecords?.[i]?.saved?'기록 완료':'미기록'):x[2]}</span></div><h3>${x[0]}</h3><div class="hw-desc">${x[1]}</div><div class="hw-bottom"><span>${tab==='mission'?'관리자 검토':tab==='field'?'현장 기록':tab==='extra'?'선택 과정':'시작 준비'}</span><span>자세히 →</span></div></button>`).join('')}</div>${tab==='mission'?`<section class="hw-panel"><h2>수료까지의 확인</h2><p>핵심 수업 15개 완료 · 종합 실습 3개 검토 완료 · 보완 요청 해결</p><div class="hw-empty">${root.graduated?'현재: 과정 수료':'현재: 학습 진행 중 · 필수 수업과 미션 검토 필요'}</div><small>핵심 15개 제출과 미션 3개 승인으로 수료를 판정합니다. 현장 적용 현황과 선택 심화는 별도로 표시합니다.</small></section>`:''}<div class="hw-foot">학습 중 저장 후 이어서 학습할 수 있습니다. 선택 심화는 준비 중입니다.</div>`}wire()}
function openLesson(i){if(i!==1&&root.openCore){root.openCore(i);return}if(i===1&&root.startLesson){root.startLesson();return}tab='core';renderNav();selection={type:'lesson',index:i};detailStep=i===5?1:0;renderDetail()}
function openExtra(i){if(root.openExtraCourse){root.openExtraCourse(tab,i);return}selection={type:'extra',index:i};renderDetail()}
function renderDetail(){const i=selection.index;if(selection.type==='lesson'){const l=lessons[i];main.innerHTML=`<button class="hw-back cursor-interaction" data-back>← 핵심 교육으로</button><div class="hw-eyebrow">CHAPTER 0${l[4]+1} · LESSON ${String(i+1).padStart(2,'0')}</div><h1>${l[0]}</h1><p>${l[1]}</p><div class="hw-row" style="margin-top:14px"><span class="hw-status">${state(i)}</span><small>${l[2]} · 전체 핵심 흐름 학습</small></div><section class="hw-panel"><h2>한 수업 안에서 배우는 것</h2><ol class="hw-steps">${l[5].map((s,n)=>`<li><small>ACTIVITY 0${n+1}</small><strong>${s}</strong><p>${['개념과 시범을 함께 확인합니다.','가이드에 따라 직접 선택·조작합니다.','다른 조건의 사례에 적용합니다.','선택 근거와 결과를 확인합니다.'][n]}</p></li>`).join('')}</ol><div class="hw-detailnav" aria-label="활동 미리보기">${l[5].map((s,n)=>`<button class="hw-secondary cursor-interaction" data-step="${n}" aria-pressed="${n===detailStep}">활동 ${n+1}</button>`).join('')}</div><div class="hw-empty" aria-live="polite"><strong>${l[5][detailStep]}</strong><p>${i===1?['가상 가족 카드에서 계약의 역할을 확인합니다.','금액 카드를 증권의 해당 항목에 배치합니다.','시간축에서 보험료를 내는 기간과 보장받는 기간을 비교합니다.','새로운 증권에서 역할·금액·기간을 찾아 설명을 완성합니다.'][detailStep]:i===5?['고객의 표현을 듣고 확인된 사실과 추측을 구분합니다.','“보험료가 부담돼요”라는 말에 이어질 질문을 선택합니다.','질문으로 확인한 사정을 반영해 설명 순서를 바꿉니다.','고객의 결정을 존중하는 후속 행동을 선택하고 이유를 확인합니다.'][detailStep]:'이 활동의 설명 → 사례 조작 → 결과 피드백을 연결하는 수업 구성입니다.'}</p></div></section><div class="hw-foot">현재는 교육 홈과 수업 구성 미리보기입니다. 실제 수업 실행·진도 저장은 연결하지 않았습니다.</div>`;}else{const x=extras[tab][i];main.innerHTML=`<button class="hw-back cursor-interaction" data-back>← ${sections.find(s=>s[0]===tab)[1]}으로</button><div class="hw-eyebrow">${sections.find(s=>s[0]===tab)[1]}</div><h1>${x[0]}</h1><p>${x[1]}</p><section class="hw-panel"><h2>${tab==='mission'&&i===0?'관리자 피드백 · 예시':'활동 구성'}</h2>${tab==='mission'&&i===0?'<ol class="hw-steps"><li><strong>잘한 점</strong><p>연락 목적을 명확하게 소개하고 상담 의사를 확인했습니다.</p></li><li><strong>보완할 점</strong><p>고객의 예산을 추측했습니다. 질문으로 확인한 사실과 가정을 구분해 주세요.</p></li></ol><div class="hw-empty"><strong>다음 연습: 질문·경청과 고객 상황 파악</strong><p>예산 확인 질문을 다시 연습한 뒤 실습을 보완합니다.</p></div><button class="hw-action cursor-interaction" style="margin-top:18px" data-lesson="4">관련 수업 구성 보기 →</button>':`<ol class="hw-steps"><li><strong>${tab==='prep'?'준비 항목 확인':tab==='field'?'활동 수행':tab==='extra'?'핵심 구조 학습':'고객 상황 파악'}</strong><p>${x[1]}</p></li><li><strong>${tab==='mission'?'제출과 피드백':tab==='field'?'기록과 확인':'사례 적용과 확인'}</strong><p>${tab==='mission'?'선택한 행동과 근거를 제출하고 보완 요청을 확인합니다.':tab==='field'?'실제 동행·동료 연습을 구분하고 다음 행동을 정리합니다.':'확인 결과와 추가로 필요한 학습을 정리합니다.'}</p></li></ol>`}</section><div class="hw-foot">예시 구성 · 실제 제출·검토·수료 상태에는 영향이 없습니다.</div>`}wire()}
root.showHome=(target='core')=>{selection=null;tab=target;renderNav();render();};root.courseTitles=lessons.map(l=>l[0]);renderNav();render();})();
</script>

:1fr 1fr;gap:0 12px}#hwarang-academy-alpha .hc-reference dt{margin-top:6px}#hwarang-academy-alpha .hc-slots{grid-template-columns:1fr}#hwarang-academy-alpha .hc-slot{min-height:65px}#hwarang-academy-alpha .hc-stage{padding:17px}}@media(prefers-reduced-motion:reduce){#hwarang-academy-alpha .hc-move{animation:none}#hwarang-academy-alpha .hc-track span{transition:none}}

<script>
(()=>{const root=document.getElementById('hwarang-academy-alpha'),main=root.querySelector('main');
const S={step:0,slide:0,max:0,person:'',roles:['','',''],amounts:['','',''],money:'',year:15,period:'',evidence:'',answer:'',check:false,passed:[false,false,false,false],tries:[0,0,0,0],hints:[false,false,false,false],msg:null,status:'draft',round:1,history:[],finalRoles:['','',''],finalAmount:'',finalPeriod:''};
const names=['이서연 · 엄마','박민수 · 아빠','박하준 · 자녀'];
const notes=[['계약을 맺는 사람','계약자는 보험회사와 계약을 맺고 보험료 납입 의무를 지는 사람입니다. 이 사례에서는 서연 씨가 계약을 맺습니다.','서연 · 계약자','계약 체결 → 보험회사'],['보장의 대상이 되는 사람','피보험자는 보험사고의 대상이 되는 사람입니다. 이 사례의 보장은 하준이의 건강을 대상으로 합니다.','하준 · 피보험자','하준의 건강 → 보장 조건 확인'],['보험금을 받을 사람','수익자는 해당 보험금을 받도록 지정된 사람입니다. 이 가상 증권은 진단보험금 수익자를 하준으로 지정했습니다. 납입자만 보고 정하지 않습니다.','하준 · 진단보험금 수익자','지급 사유 충족 → 지정 수익자']];
const btn=(txt,action,primary=false,disabled=false)=>`<button class="${primary?'hw-action':'hw-secondary'} cursor-interaction" data-action="${action}" ${disabled?'disabled':''}>${txt}</button>`;
const opts=(vals,current)=>'<option value="">선택해 주세요</option>'+vals.map((v,i)=>`<option value="${i}" ${String(i)===current?'selected':''}>${v}</option>`).join('');
root.lessonState=S;function shell(content,reference=true){root.active={lesson:'l02',state:S};main.innerHTML=`<button class="hw-back cursor-interaction" data-action="home">← 교육 홈</button><div class="hw-eyebrow">CHAPTER 01 · 계약 읽기 실습</div><h1>보험계약 한 장 읽기</h1><p>계약의 역할·금액·기간을 읽고, 새로운 사례에 적용해 보세요.</p><div class="hc-navsteps" aria-label="수업 단계">${['개념 익히기','역할 배치','금액 구분','기간 비교','새 증권 적용','결과와 피드백'].map((t,i)=>`<button class="cursor-interaction" data-stage="${i}" aria-current="${i===S.step?'step':'false'}" ${i>S.max||(i>1&&!S.passed.slice(0,i-1).every(Boolean))?'disabled':''}>${i<S.step?'✓ ':''}${t}</button>`).join('')}</div><div class="hc-layout" ${!reference?'style="grid-template-columns:1fr"':''}><section class="hc-stage">${content}</section>${reference?`<aside class="hc-reference"><strong>가상 증권 A</strong><small style="display:block">학습용 조건 · 실제 상품 아님</small><dl><div><dt>계약자</dt><dd>이서연</dd></div><div><dt>피보험자</dt><dd>박하준</dd></div><div><dt>진단보험금 수익자</dt><dd>박하준</dd></div><div><dt>월 보험료</dt><dd>5만 원</dd></div><div><dt>진단담보 가입금액</dt><dd>1,000만 원</dd></div><div><dt>이번 가상 사례 지급액</dt><dd>500만 원</dd></div><div><dt>납입기간</dt><dd>20년</dd></div><div><dt>보장기간</dt><dd>가입일부터 60년</dd></div></dl><small>이번 사례는 감액 조건에 따라 가입금액의 50% 지급으로 설정했습니다.</small></aside>`:''}</div><div class="hw-foot">선택 내용은 아래 학습 중 저장 버튼으로 보관할 수 있습니다.</div>`;bind();}
function message(){return S.msg?`<div class="hc-message ${S.msg.ok?'good':'bad'} hc-move" role="status"><strong>${S.msg.ok?'확인했어요':'다시 살펴볼 부분'}</strong><p>${S.msg.text}</p></div>`:''}
function next(n){S.step=n;S.max=Math.max(S.max,n);S.msg=null;render()}
function feedback(ok,text,k){S.tries[k]++;S.passed[k]=ok;S.msg={ok,text};render()}
function render(){if(S.step===0){const x=notes[S.slide];shell(`<div class="hw-eyebrow">CONCEPT ${S.slide+1} / 3</div><h2>${x[0]}</h2><div class="hc-flow"><span class="active">${x[2]}</span><span>${x[3]}</span></div><p>${x[1]}</p><div class="hc-message"><strong>오늘 만날 가족</strong><p>서연 씨가 자녀 하준이의 건강을 보장하는 계약을 맺었습니다. 아빠 민수 씨도 가족이지만, 가족이라는 이유만으로 계약의 역할이 정해지지는 않습니다.</p></div><div class="hc-controls">${btn('이전 설명','prevSlide',false,S.slide===0)}${btn(S.slide===2?'직접 배치해 보기 →':'다음 설명 →','nextSlide',true)}</div>`);return}
if(S.step===1){shell(`<div class="hw-eyebrow">PRACTICE 01</div><h2>누가 어떤 역할일까요?</h2><p>가족 카드를 선택한 뒤 역할 칸을 누르세요. 같은 사람을 여러 역할에 배치할 수 있습니다.</p><div class="hc-choices">${names.map(n=>`<button class="hc-choice cursor-interaction" data-person="${n}" aria-pressed="${S.person===n}">${n}</button>`).join('')}</div><div class="hc-slots">${['계약자','피보험자','진단보험금 수익자'].map((n,i)=>`<button class="hc-slot cursor-interaction" data-role="${i}" data-filled="${!!S.roles[i]}">${n}<b>${S.roles[i]||'카드를 선택해 배치'}</b></button>`).join('')}</div>${message()}<div class="hc-controls">${btn('역할 확인','checkRoles',true)}${btn('힌트','hint')}${btn('다시 배치','resetRoles')}${S.passed[0]?btn('금액 구분으로 →','next'):''}</div>`);return}
if(S.step===2){shell(`<div class="hw-eyebrow">PRACTICE 02</div><h2>5만 원, 1,000만 원, 500만 원</h2><p>보험료는 계약에 따라 내는 돈, 가입금액은 보장의 기준 금액, 보험금은 지급 사유와 조건에 따라 받는 돈입니다.</p><div class="hc-choices">${['5만 원','1,000만 원','500만 원'].map(n=>`<button class="hc-choice cursor-interaction" data-money="${n}" aria-pressed="${S.money===n}">${n}</button>`).join('')}</div><div class="hc-slots">${['월 보험료','가입금액','이번 지급 보험금'].map((n,i)=>`<button class="hc-slot cursor-interaction" data-amount="${i}" data-filled="${!!S.amounts[i]}">${n}<b>${S.amounts[i]||'금액 선택 후 배치'}</b></button>`).join('')}</div>${message()}<div class="hc-controls">${btn('금액 확인','checkMoney',true)}${btn('힌트','hint')}${S.passed[1]?btn('기간 비교로 →','next'):''}</div>`);return}
if(S.step===3){shell(`<div class="hw-eyebrow">PRACTICE 03</div><h2>납입이 끝나면 보장도 끝날까요?</h2><p>이 사례의 계약은 20년 납입·60년 보장입니다. 계약이 유지된다는 가정에서 시간축을 움직여 보세요.</p><div class="hc-timeline"><small>보험료 납입 · 20년</small><div class="hc-track"><span style="width:33.333%"></span></div><small>보장 · 60년</small><div class="hc-track cover"><span style="width:100%"></span></div><div class="hc-labels"><span>가입</span><span>20년</span><span>40년</span><span>60년</span></div></div><label class="hc-label">가입 후 <strong data-yearlabel>${S.year}</strong>년<input aria-label="가입 후 경과 연수" type="range" min="0" max="60" value="${S.year}" data-year></label><div class="hc-message" aria-live="polite" data-yearmsg>${yearText()}</div><h3>가입 후 25년 시점에는?</h3><div class="hc-choices">${['납입도 보장도 종료','납입 종료 · 보장은 계속','계속 보험료를 내야 보장'].map((n,i)=>`<button class="hc-choice cursor-interaction" data-period="${i}" aria-pressed="${S.period===String(i)}">${n}</button>`).join('')}</div>${message()}<div class="hc-controls">${btn('기간 확인','checkPeriod',true)}${btn('힌트','hint')}${S.passed[2]?btn('새로운 사례로 →','next'):''}</div>`);return}
if(S.step===4){shell(`<div class="hw-eyebrow">TRANSFER · 새로운 가상 증권 B</div><h2>이번에는 도윤 씨의 계약입니다.</h2><p>힌트 없이 새 증권을 읽고, 고객에게 전달할 설명을 구성해 보세요.</p><div class="hw-empty"><strong>학습용 증권 B</strong><div class="hc-receipt"><span>계약자 / 피보험자</span><b>김도윤 / 김도윤</b></div><div class="hc-receipt"><span>사망보험금 수익자</span><b>배우자 이지우</b></div><div class="hc-receipt"><span>월 보험료 / 가입금액</span><b>8만 원 / 3,000만 원</b></div><div class="hc-receipt"><span>납입 / 보장</span><b>10년 / 가입일부터 30년</b></div></div>${['계약자','피보험자','사망보험금 수익자'].map((t,i)=>`<label class="hc-label">${t}<select data-finalrole="${i}">${opts(['김도윤','이지우'],S.finalRoles[i])}</select></label>`).join('')}<label>매월 납입하는 금액<select data-finalamount>${opts(['8만 원','3,000만 원'],S.finalAmount)}</select></label><label>가입 후 15년의 상태 (계약 유지 가정)<select data-finalperiod>${opts(['납입 종료 · 보장 유지','납입과 보장 모두 종료'],S.finalPeriod)}</select></label><h3>수익자 판단의 근거를 선택하세요.</h3><div class="hc-choices">${['보험료를 낸 사람','증권의 사망보험금 수익자 지정','가족 중 나이가 많은 사람'].map((t,i)=>`<button class="hc-choice cursor-interaction" data-evidence="${i}" aria-pressed="${S.evidence===String(i)}">${t}</button>`).join('')}</div>${message()}<div class="hc-controls">${btn('설명 구성 확인','checkFinal',true)}${S.passed[3]?btn('실습 기록 확인 →','next'):''}</div>`,false);return}
result();}
function yearText(){return S.year<20?'보험료 납입 중 · 보장 기간 안입니다.':S.year<60?'보험료 납입 종료 · 보장 기간은 계속됩니다.':'설정된 60년 보장기간의 종료 시점입니다.'}
function result(){const submitted=S.status!=='draft';shell(`<div class="hw-eyebrow">LEARNING REVIEW</div><h2>${submitted?'실습 결과':'배운 내용을 정리했어요'}</h2><div class="hc-success">4 / 4개 활동 확인 완료</div><p>역할, 금액, 기간을 구분하고 새로운 증권에 적용했습니다.</p><div class="hc-receipt"><span>역할 이해</span><b>계약자·피보험자: 도윤<br>사망보험금 수익자: 지우</b></div><div class="hc-receipt"><span>금액 구분</span><b>월 보험료 8만 원<br>가입금액 3,000만 원</b></div><div class="hc-receipt"><span>기간 구분</span><b>15년 시점: 납입 종료 · 보장 유지</b></div><div class="hc-receipt"><span>판단 근거</span><b>해당 보험금의 수익자 지정</b></div><div class="hc-receipt"><span>학습 과정</span><b>확인 시도 ${S.tries.reduce((a,b)=>a+b,0)}회 · 힌트 ${S.hints.filter(Boolean).length}개 활동</b></div><div class="hc-message good"><strong>이번에 확인한 성장</strong><p>가족관계나 납입자만으로 판단하지 않고, 증권의 역할과 조건을 확인했습니다.</p></div><div class="hc-message"><strong>다음 연습 포인트</strong><p>${S.tries.some(x=>x>1)?'다시 확인했던 활동의 근거를 새 사례에서도 먼저 찾아보세요.':'다른 담보에서도 수익자 지정과 지급 조건을 나누어 확인해 보세요.'} 이 결과만으로 실제 상담 역량 전체를 평가하지는 않습니다.</p></div>${!submitted?`<label class="hc-check"><input type="checkbox" data-confirm ${S.check?'checked':''}><span>자동 정리된 선택과 근거를 확인했습니다.</span></label>${btn('실습 제출','submit',true,!S.check)}`:`<div class="hw-empty" role="status"><strong>${{submitted:'제출됨 · 관리자 검토 대기',revision:'보완 요청 · 근거 확인 재연습',approved:'검토 완료 · 이 실습 승인'}[S.status]}</strong><p>${S.status==='revision'?'수익자 판단 근거를 다시 확인한 뒤 재제출해 주세요.':S.status==='approved'?'전체 과정 수료는 다른 필수 수업과 종합 실습 조건을 함께 확인합니다.':'제출 결과와 관리자 검토 완료를 구분해서 표시합니다.'}</p></div>`}<div class="hc-controls">${S.status==='revision'?btn('근거 보완 후 재제출 →','revise',true):''}${btn('교육 홈으로','home')}${btn('다시 연습','retry')}</div>${S.history.length?`<details style="margin-top:18px"><summary class="cursor-interaction">이번 학습의 제출 이력 ${S.history.length}건</summary>${S.history.map(h=>`<div class="hc-receipt"><span>${h.round}차 제출</span><b>${h.status}</b></div>`).join('')}</details>`:''}`,false)}
function bind(){main.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));main.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{S.step=Number(b.dataset.stage);S.msg=null;render()});main.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{S.person=b.dataset.person;render()});main.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{if(!S.person){S.msg={ok:false,text:'먼저 가족 카드 한 장을 선택해 주세요.'};render();return}S.roles[Number(b.dataset.role)]=S.person;S.passed[0]=false;S.msg=null;render()});main.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>{S.money=b.dataset.money;render()});main.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{if(!S.money){S.msg={ok:false,text:'먼저 금액 카드를 선택해 주세요.'};render();return}S.amounts[Number(b.dataset.amount)]=S.money;S.passed[1]=false;S.msg=null;render()});main.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{S.period=b.dataset.period;S.passed[2]=false;S.msg=null;render()});const range=main.querySelector('[data-year]');if(range)range.oninput=()=>{S.year=Number(range.value);main.querySelector('[data-yearlabel]').textContent=S.year;main.querySelector('[data-yearmsg]').textContent=yearText()};main.querySelectorAll('[data-finalrole]').forEach(e=>e.onchange=()=>{S.finalRoles[Number(e.dataset.finalrole)]=e.value;invalidateFinal()});const a=main.querySelector('[data-finalamount]');if(a)a.onchange=()=>{S.finalAmount=a.value;invalidateFinal()};const p=main.querySelector('[data-finalperiod]');if(p)p.onchange=()=>{S.finalPeriod=p.value;invalidateFinal()};main.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{S.evidence=b.dataset.evidence;S.passed[3]=false;S.msg=null;render()});const c=main.querySelector('[data-confirm]');if(c)c.onchange=()=>{S.check=c.checked;main.querySelector('[data-action=submit]').disabled=!c.checked};}
function invalidateFinal(){S.passed[3]=false;S.msg=null;const nextButton=main.querySelector('[data-action=next]');if(nextButton)nextButton.remove();const msg=main.querySelector('[role=status]');if(msg)msg.remove()}
function act(a){if(a==='home'){root.showHome();return}if(a==='prevSlide'){S.slide=Math.max(0,S.slide-1);render();return}if(a==='nextSlide'){if(S.slide<2){S.slide++;render()}else next(1);return}if(a==='next'){if(S.passed.slice(0,S.step).every(Boolean))next(S.step+1);return}if(a==='resetRoles'){S.roles=['','',''];S.person='';S.passed[0]=false;S.msg=null;render();return}if(a==='hint'){const k=S.step-1;S.hints[k]=true;S.msg={ok:false,text:['증권에서 계약자, 피보험자, 진단보험금 수익자 항목을 각각 확인하세요. 하준이는 두 역할을 맡습니다.','내는 돈, 보장의 기준, 실제 지급액을 구분하세요. 이번 사례는 감액 조건이 있습니다.','20년과 60년은 서로 다른 종료 시점입니다. 25년은 두 시점 사이입니다.'][k]};render();return}if(a==='checkRoles'){const ok=S.roles[0]===names[0]&&S.roles[1]===names[2]&&S.roles[2]===names[2];feedback(ok,ok?'서연 씨가 계약자, 하준이가 피보험자이자 진단보험금 수익자입니다. 한 사람이 여러 역할을 맡을 수 있습니다.':S.roles.some(x=>!x)?'세 역할을 모두 배치해 주세요.':S.roles[2]!==names[2]?'보험료 납입자나 가족관계로 수익자를 정하지 않습니다. 증권의 진단보험금 수익자를 다시 확인해 주세요.':'계약을 맺은 사람과 보장의 대상을 구분해 보세요. 이 계약은 서연 씨가 맺고 하준이의 건강을 보장합니다.',0);return}if(a==='checkMoney'){const ok=S.amounts.join('|')==='5만 원|1,000만 원|500만 원';feedback(ok,ok?'월 보험료 5만 원을 내고, 가입금액 1,000만 원을 기준으로 이번 사례에서는 500만 원을 받습니다. 가입금액과 실제 지급액이 항상 같지는 않습니다.':'매월 내는 돈은 5만 원입니다. 가입금액은 기준이며, 이번 지급액에는 가상 감액 조건 50%가 반영됩니다.',1);return}if(a==='checkPeriod'){feedback(S.period==='1',S.period==='1'?'25년 시점에는 20년 납입이 끝났지만, 설정된 60년 보장기간 안에 있습니다.':'납입기간과 보장기간을 따로 확인하세요. 보험료 납입 종료가 곧 보장 종료를 의미하지는 않습니다.',2);return}if(a==='checkFinal'){const ok=S.finalRoles.join(',')==='0,0,1'&&S.finalAmount==='0'&&S.finalPeriod==='0'&&S.evidence==='1';feedback(ok,ok?'도윤 씨가 계약자·피보험자이고 지우 씨가 지정 수익자입니다. 월 8만 원, 10년 납입·30년 보장을 정확히 읽었습니다.':S.finalRoles.some(x=>!x)||!S.finalAmount||!S.finalPeriod||!S.evidence?'모든 항목과 판단 근거를 선택해 주세요.':S.evidence!=='1'?'수익자는 납입자나 나이가 아니라 해당 보험금의 지정 내용을 근거로 판단하세요.':'역할은 도윤·도윤·지우입니다. 월 8만 원이며, 가입 후 15년에는 10년 납입이 끝나고 30년 보장은 계속됩니다. 증권과 다시 대조하세요.',3);return}if(a==='submit'){root.pendingSubmit=true;if(!S.check||!S.passed.every(Boolean))return;S.status='submitted';root.demoStatus='학습 완료 · 검토 대기';root.demoDone=true;S.history.push({round:S.round,status:'제출됨'});result();return}if(false){S.status=a==='revision'?'revision':'approved';root.demoStatus=a==='revision'?'보완 필요':'검토 완료';root.demoDone=a!=='revision';if(S.history.length)S.history[S.history.length-1].status=a==='revision'?'보완 요청':'검토 완료';result();return}if(a==='revise'){S.round++;S.status='draft';root.demoStatus='보완 중';root.demoDone=false;S.check=false;S.passed[3]=false;S.evidence='';next(4);return}if(a==='retry'){S.step=0;S.slide=0;S.max=0;S.person='';S.roles=['','',''];S.money='';S.amounts=['','',''];S.period='';S.evidence='';S.finalRoles=['','',''];S.finalAmount='';S.finalPeriod='';S.passed=[false,false,false,false];S.tries=[0,0,0,0];S.hints=[false,false,false,false];S.msg=null;S.check=false;S.status='draft';root.demoStatus='재연습 중';root.demoDone=false;S.round++;render();}}
root.startLesson=()=>render();
})();
</script>

<style>
#hwarang-academy-alpha .ha-kicker{color:var(--hw-orange);font-size:12px;letter-spacing:.6px;margin-bottom:8px}#hwarang-academy-alpha .ha-options{display:grid;gap:10px;margin:18px 0}#hwarang-academy-alpha .ha-option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--hw-line);background:var(--hw-panel);padding:14px;text-align:left;border-radius:9px;min-height:48px}#hwarang-academy-alpha .ha-option[aria-pressed=true]{background:var(--hw-soft);border-color:var(--hw-orange)}#hwarang-academy-alpha .ha-letter{font-size:12px;padding:2px 7px;background:var(--hw-tint);border-radius:5px}#hwarang-academy-alpha .ha-reading{padding:17px;border-left:3px solid var(--hw-orange);background:var(--hw-tint);margin:20px 0;border-radius:0 9px 9px 0}#hwarang-academy-alpha .ha-reading p{color:var(--hw-ink)}#hwarang-academy-alpha .ha-concepts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}#hwarang-academy-alpha .ha-concepts button{padding:14px;background:var(--hw-panel);border:1px solid var(--hw-line);border-radius:9px;text-align:left}#hwarang-academy-alpha .ha-concepts button[aria-pressed=true]{background:var(--hw-tint);border-color:var(--hw-muted)}#hwarang-academy-alpha .ha-concepts small{display:block;margin-bottom:7px}#hwarang-academy-alpha .ha-dialogue{padding:18px;background:var(--hw-tint);border-radius:12px;margin:18px 0}#hwarang-academy-alpha .ha-dialogue p{color:var(--hw-ink);font-size:16px;margin-top:7px}#hwarang-academy-alpha .ha-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}#hwarang-academy-alpha .ha-footnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}#hwarang-academy-alpha .ha-list{padding-left:20px;color:var(--hw-muted)}#hwarang-academy-alpha .ha-list li{margin:9px 0}#hwarang-academy-alpha .ha-review{border:1px solid var(--hw-line);border-radius:9px;padding:14px;margin-top:12px}#hwarang-academy-alpha .ha-path{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}#hwarang-academy-alpha .ha-path span{padding:7px 10px;border-radius:6px;background:var(--hw-tint);font-size:12px}#hwarang-academy-alpha .ha-path .active{background:var(--hw-ink);color:var(--hw-panel)}#hwarang-academy-alpha .ha-checklist{display:grid;gap:14px;padding:10px 0}#hwarang-academy-alpha .ha-checklist label{display:flex;gap:10px;align-items:flex-start;padding:13px;background:var(--hw-tint);border-radius:7px}#hwarang-academy-alpha .ha-checklist input{margin-top:6px}#hwarang-academy-alpha .ha-note{font-size:12px;color:var(--hw-muted);margin:14px 0}@media(max-width:600px){#hwarang-academy-alpha .ha-concepts,#hwarang-academy-alpha .ha-grid{grid-template-columns:1fr}}
</style>
<script>
(()=>{const root=document.getElementById('hwarang-academy-alpha'),main=root.querySelector('main');
const D={
0:{c:[['위험부터 보기','고객이 걱정하는 사건과 그 사건이 생활에 미치는 영향을 나눠 봅니다. 상품 이름보다 먼저 확인할 내용입니다.'],['수단의 역할','보험은 약정된 조건에 따른 보장을 제공합니다. 모든 지출이나 위험을 해결한다고 설명하지 않습니다.'],['상담 흐름','목적 확인 → 상황 파악 → 자료 확인 → 대안 설명 → 이해·의사 확인 순서로 연결합니다.']],case:'가상 고객 민수 씨: “제가 일을 쉬게 되면 생활비가 걱정돼요.” 아직 소득, 비상자금, 가입 계약은 확인하지 않았습니다.',q:'상담을 이어갈 첫 행동은 무엇일까요?',o:['가장 큰 보장부터 바로 추천한다','걱정하는 기간과 생활비, 준비된 자금을 질문한다','보험이면 생활비 문제가 모두 해결된다고 말한다'],a:1,f:['필요와 준비 상태를 모르면 보장 크기의 근거가 없습니다.','걱정을 구체적인 상황으로 바꾸면 필요한 자료와 대안을 판단할 수 있습니다.','계약의 보장 조건과 고객의 실제 필요를 확인해야 합니다.'],transfer:'새 고객은 “보험료를 줄이고 싶다”고 합니다. 계약 자료는 아직 없습니다.',tq:'먼저 할 일은?',to:['기존 계약을 모두 정리한다','보험료가 낮은 상품만 보여준다','부담 수준과 기존 계약을 확인한다'],ta:2,tf:'보험료 부담과 기존 보장·조건을 함께 확인해야 비교할 기준이 생깁니다.'},
2:{c:[['자료의 적용 범위','같은 상품명이라도 계약 시점과 특약이 다를 수 있습니다. 고객 계약에 적용되는 자료부터 찾습니다.'],['조건을 나누기','주계약·특약, 갱신 여부, 지급 요건, 제외 조건을 각각 확인합니다. 제목만 보고 내용을 추측하지 않습니다.'],['근거 남기기','어느 자료의 어떤 항목으로 판단했는지 선택해 두면 설명과 재확인이 쉬워집니다.']],case:'학습 자료: 가입 당시 특약 요약에는 “최초 계약일부터 1년 미만, 해당 지급액의 50%”라고 적혀 있습니다. 새 홍보물에는 이 조건이 보이지 않습니다.',q:'이 계약을 설명할 때 우선 대조할 자료는?',o:['지금 배포하는 홍보물만 본다','고객 계약에 적용되는 약관·특약과 가입 자료를 대조한다','상품 이름이 같으니 조건도 같다고 본다'],a:1,f:['홍보물만으로 계약별 조건을 확정할 수 없습니다.','계약 시점과 가입 특약을 맞추어 조건의 적용 여부를 확인합니다.','같은 이름만으로 계약 내용이 같다고 판단하지 않습니다.'],transfer:'두 문서의 내용이 다르고, 어떤 문서가 고객의 가입 시점에 적용되는지 확인되지 않았습니다.',tq:'설명에는 어떻게 표시할까요?',to:['유리한 조건을 확정해 안내한다','적용 문서 확인이 필요하다고 구분한다','두 조건의 중간값으로 안내한다'],ta:1,tf:'자료가 충돌하면 적용 범위를 먼저 확인하고 미확인 상태를 분리합니다.'},
3:{c:[['목적을 밝히기','누구인지, 어떤 업무로 연락했는지 짧게 밝힙니다. 고객이 연락을 이해할 수 있어야 합니다.'],['의사를 확인하기','통화 가능 여부와 상담 의사를 확인합니다. 고객이 원하지 않는 대화를 계속 밀어붙이지 않습니다.'],['다음 행동 합의','일시·방법·준비 자료를 고객과 합의하고 확인합니다. 약속 성립과 단순 제안은 구분합니다.']],case:'가상 이관 고객 지우 씨가 “처음 연락받는 분인데 누구시죠?”라고 묻습니다.',q:'어떤 답변으로 이어갈까요?',o:['담당자니까 주민번호부터 알려 달라고 한다','상품이 좋다는 이야기부터 시작한다','소속·이름·연락 목적과 확인 가능한 공식 경로를 안내한다'],a:2,f:['담당 관계와 목적을 이해하기 전에 민감정보를 요구하지 않습니다.','고객의 질문은 신원과 연락 목적에 관한 것입니다.','고객이 연락을 확인할 수 있게 하고 대화 가능 여부를 묻습니다.'],transfer:'고객이 “지금 회의 중이에요”라고 말합니다.',tq:'다음 응답은?',to:['30초면 된다고 설명을 계속한다','편한 연락 시간과 재연락 의사를 확인한다','상담 동의로 기록한다'],ta:1,tf:'지금 통화가 어렵다는 반응과 상담 의사를 구분하고 고객이 동의한 다음 행동을 정합니다.'},
4:{c:[['질문으로 확인','고객 표현에 의미를 임의로 붙이지 않고 구체적인 상황을 묻습니다.'],['사실과 해석 분리','고객이 말한 내용, 문서로 확인한 내용, 아직 추정인 내용을 구분합니다.'],['요약하고 되묻기','핵심 요구를 요약한 뒤 고객이 맞다고 확인하도록 합니다.']],case:'민수 씨: “보험이 너무 많아서 정리하고 싶어요.” 월 보험료나 실제 계약 수는 아직 확인하지 않았습니다.',q:'가장 적절한 질문은?',o:['어떤 부분이 가장 부담스러우신가요? 보험료, 관리, 보장 내용 중 무엇일까요?','월 보험료가 50만 원은 넘겠네요?','보험이 많으면 전부 중복이지요?'],a:0,f:['정리하고 싶은 이유를 고객의 말로 확인할 수 있습니다.','확인하지 않은 숫자를 사실처럼 전제했습니다.','계약 수만으로 보장 중복을 판단할 수 없습니다.'],transfer:'고객이 “월 20만 원 정도면 편할 것 같아요”라고 답했습니다.',tq:'기록할 내용은?',to:['현재 보험료는 20만 원','모든 보장을 20만 원으로 맞추기로 확정','희망 부담 수준 약 20만 원 · 현재 보험료는 자료 확인 필요'],ta:2,tf:'희망 예산과 현재 납입액은 서로 다른 정보입니다.'},
5:{c:[['망설임의 이유','부담, 시간, 필요성, 신뢰 중 어떤 이유인지 질문으로 확인합니다.'],['설명 조정','같은 설명을 반복하기보다 확인된 이유에 맞게 내용과 순서를 바꿉니다.'],['결정을 존중','상담을 이어갈지, 자료만 볼지, 중단할지 고객 의사를 반영합니다.']],case:'지우 씨: “좀 생각해 볼게요.” 설명 내용에 대한 이해 여부와 망설임의 이유는 아직 모릅니다.',q:'어떤 말로 이어갈까요?',o:['오늘 결정하지 않으면 손해라고 압박한다','더 확인하고 싶은 내용이나 고민되는 부분이 있으실까요?','거절로 확정하고 이유를 임의로 적는다'],a:1,f:['압박은 고객이 판단할 여지를 줄입니다.','고객이 말할 수 있는 범위를 열어 두고 필요한 설명을 찾습니다.','모호한 반응을 특정 이유로 단정하지 않습니다.'],transfer:'고객이 “이제 연락하지 말아 주세요”라고 명확히 말했습니다.',tq:'다음 행동은?',to:['설명 자료를 계속 보낸다','다른 번호로 다시 연락한다','의사를 확인하고 해당 연락을 중단한다'],ta:2,tf:'명확한 중단 의사는 후속 연락 계획에 반영합니다.'},
6:{c:[['진료비 항목','총액만 보지 않고 급여·비급여와 세부 항목을 구분해 읽습니다.'],['계약 조건','자기부담, 제외 항목, 한도 등 고객 계약의 조건을 확인합니다.'],['확인과 계산','확인된 항목만 조건에 넣어 계산하고, 미확인 항목은 별도로 표시합니다.']],case:'학습용 조건: 인정 의료비에서 자기부담을 제외합니다. 영수증은 총 30만 원이며, 이 중 10만 원 항목의 보장 여부가 확인되지 않았습니다.',q:'현재 안내할 수 있는 것은?',o:['30만 원 전액 지급 확정','세부 항목과 적용 계약을 확인한 뒤 계산 필요','모든 비급여는 무조건 제외'],a:1,f:['자기부담과 제외 조건을 아직 반영하지 않았습니다.','금액이 있다는 것과 지급 대상이라는 것은 다릅니다.','항목과 계약 조건을 확인하지 않고 일괄 판단하지 않습니다.'],transfer:'확인된 인정 의료비 20만 원, 이 학습용 계약의 자기부담은 4만 원입니다. 다른 조정은 없습니다.',tq:'가상 계산 결과는?',to:['16만 원','20만 원','24만 원'],ta:0,tf:'이 가상 조건에서는 20만 원에서 4만 원을 빼 16만 원입니다. 실제 계약의 요건과 한도는 별도로 확인해야 합니다.'},
7:{c:[['이름과 범위','진단명과 담보명이 비슷해 보여도 정의와 보장 범위를 대조합니다.'],['지급 사유','진단 시 지급인지, 특정 치료를 받았을 때 지급인지 구분합니다.'],['조건 비교','금액만 비교하지 않고 정의·요건·제외·횟수 등의 조건을 함께 확인합니다.']],case:'가상 담보 A: 특정 진단을 확정하면 지급. 가상 담보 B: 해당 진단 후 정해진 치료를 실제 받으면 지급. 가입금액은 같습니다.',q:'두 담보를 어떻게 설명할까요?',o:['금액이 같으니 같은 보장','담보 B도 진단만 받으면 지급','지급을 판단하는 사건과 조건이 다르다'],a:2,f:['지급 사유가 다르면 금액만 같아도 같은 보장이 아닙니다.','B에는 정해진 치료를 받는 조건이 있습니다.','진단과 치료라는 각각의 지급 사유를 구분했습니다.'],transfer:'고객의 진단명은 확인했지만 약관의 진단 정의에 해당하는지 아직 대조하지 않았습니다.',tq:'다음 행동은?',to:['명칭이 비슷하니 지급 확정','진단 자료와 담보 정의를 대조한다','가입금액만 읽어 준다'],ta:1,tf:'진단명과 약관의 정의·요건을 확인하는 단계가 필요합니다.'},
8:{c:[['사건부터 분류','수술, 입원, 장해 상태를 서로 다른 확인 대상으로 봅니다.'],['정의 확인','병원에서 사용하는 표현과 계약에서 정한 정의가 맞는지 대조합니다.'],['자료 요청','판단에 필요한 진단·처치·기간·상태 자료 중 무엇이 없는지 찾습니다.']],case:'고객: “병원에서 시술을 받았어요. 수술비 나오죠?” 계약의 수술 정의와 처치명은 아직 없습니다.',q:'우선 할 일은?',o:['시술은 전부 수술비가 나온다고 한다','정확한 처치명과 자료, 해당 담보 정의를 확인한다','시술은 모두 지급되지 않는다고 한다'],a:1,f:['명칭만으로 모든 사례를 동일하게 판단할 수 없습니다.','실제 처치와 계약의 정의를 연결해야 합니다.','계약과 사건 확인 없이 반대 방향으로도 단정하지 않습니다.'],transfer:'학습용 담보는 연속 입원 일수 조건이 있습니다. 입원 사실만 확인되고 기간은 없습니다.',tq:'추가로 필요한 정보는?',to:['입원 시작일과 종료일 등 기간 자료','고객의 가족 수','다른 보험료 총액'],ta:0,tf:'지급 조건을 판단하는 데 직접 필요한 기간 자료를 확인합니다.'},
9:{c:[['가족의 필요','생활비, 부채, 부양, 돌봄 등 사건 이후의 필요를 나눠 확인합니다.'],['보장 구조','보장하는 사건과 기간을 구분하고 고객의 필요와 연결합니다.'],['성급한 추천 피하기','가족 구성만으로 상품이나 금액을 확정하지 않습니다. 준비된 자원도 함께 봅니다.']],case:'민수 씨는 자녀가 있고 주택 대출이 있습니다. “제가 없으면 가족 생활이 걱정돼요”라고 말합니다.',q:'먼저 확인할 항목은?',o:['가족 생활비·부채·준비 자산·기존 보장','나이가 같으니 다른 고객과 같은 가입금액','판매 중인 상품의 높은 가입금액'],a:0,f:['필요와 준비 상태를 함께 봐야 부족한 부분을 판단할 수 있습니다.','같은 나이여도 가족의 필요는 다릅니다.','고객 필요보다 상품 금액이 먼저 오면 추천 근거가 약해집니다.'],transfer:'고객이 “간병이 걱정된다”고 말했지만 생활 지원이 필요한지 비용이 걱정인지 모릅니다.',tq:'다음 질문은?',to:['간병 상품을 바로 보여 준다','어떤 상황과 부담이 가장 걱정되는지 확인한다','사망 보장으로 모두 해결된다고 한다'],ta:1,tf:'돌봄 상황과 부담을 구체화한 후 관련 보장과 조건을 확인합니다.'},
10:{c:[['계약별로 정리','계약자·대상·담보·금액·기간을 같은 항목으로 정리합니다.'],['중복과 공백','이름이 같은지보다 보장하는 사건·조건이 어떻게 겹치는지 비교합니다.'],['미확인 표시','읽히지 않거나 빠진 정보는 0으로 확정하지 않고 확인이 필요한 항목으로 구분합니다.']],case:'가상 증권 두 장에 각각 “수술”이라는 단어가 있습니다. 한 장은 수술 분류와 지급 조건 페이지가 빠져 있습니다.',q:'분석표에는 어떻게 기록할까요?',o:['같은 보장이니 하나는 불필요','조건 페이지 확인 필요 · 중복 판단 보류','빠진 항목은 보장 0원'],a:1,f:['이름만으로 동일한 보장이라고 판단했습니다.','확인된 사실과 아직 판단할 수 없는 부분을 구분했습니다.','정보 누락은 실제 0원과 다릅니다.'],transfer:'증권의 월 보험료는 읽히지만 보장기간은 잘려 있습니다.',tq:'올바른 정리는?',to:['두 항목 모두 알 수 없음','월 보험료만 확정 기록 · 보장기간 확인 필요','보장기간을 임의로 추정'],ta:1,tf:'확인된 값은 살리고 미확인 항목만 따로 표시합니다.'},
11:{c:[['비교 기준 맞추기','보장 사건·기간·조건과 비용 기준을 맞추어 대안을 비교합니다.'],['기존 계약 영향','변경으로 없어지는 조건이나 새로 확인해야 할 요건을 따로 봅니다.'],['고객 우선순위','비용, 유지 가능성, 보장 필요 등 고객이 정한 우선순위에 맞춰 설명합니다.']],case:'가상 A안은 월 10만 원, B안은 월 7만 원입니다. B안의 보장기간이 더 짧고 새 가입 심사는 아직 확인하지 않았습니다.',q:'어떤 비교가 적절할까요?',o:['B가 저렴하니 무조건 유리','보험료 차이와 보장기간·가입 가능성·기존 계약 영향을 함께 비교','월 보험료만 큰 글씨로 표시'],a:1,f:['가격 이외의 차이를 빼고 결론을 냈습니다.','같은 기준으로 차이를 보여 주고 미확인 사항을 분리합니다.','조건 차이를 숨기면 고객이 대안을 판단하기 어렵습니다.'],transfer:'새 계약의 인수 여부가 확인되지 않은 상태입니다.',tq:'기존 계약에 대해서는?',to:['먼저 해지하도록 권한다','새 계약과 변경 영향을 확인하기 전에는 성급한 정리를 권하지 않는다','확인 없이 두 계약이 동일하다고 한다'],ta:1,tf:'대안의 실행 가능성과 기존 계약의 영향을 먼저 확인합니다.'},
12:{c:[['고객 목적부터','무엇을 해결하려는 제안인지 고객이 말한 목적과 연결합니다.'],['차이와 근거','추천 이유, 대안의 차이, 미확인 조건을 나누어 설명합니다.'],['이해 확인','“이해되시죠?”로 끝내지 않고 고객이 이해한 내용을 확인합니다.']],case:'비교표를 본 고객이 “왜 이 안을 권하는지 잘 모르겠어요”라고 말합니다.',q:'설명 순서를 어떻게 바꿀까요?',o:['표를 처음부터 더 빨리 읽는다','상품 이름을 반복한다','고객의 우선순위 → 비교 차이 → 추천 근거 순서로 설명한다'],a:2,f:['같은 설명을 반복하기 전에 고객이 놓친 연결을 찾아야 합니다.','상품 이름만으로 추천 이유가 전달되지 않습니다.','고객의 목적과 제안 이유를 연결합니다.'],transfer:'설명이 끝났습니다. 고객이 핵심 차이를 이해했는지 확인하려 합니다.',tq:'적절한 질문은?',to:['두 안에서 가장 다르다고 이해하신 부분이 무엇인가요?','다 이해하셨죠?','서명부터 하실까요?'],ta:0,tf:'고객의 말로 이해한 내용을 들으면 잘못 전달된 부분을 바로잡을 수 있습니다.'},
13:{c:[['알릴 사항 확인','질문과 기준을 고객이 이해하도록 돕고, 응답을 임의로 축소하거나 바꾸지 않습니다.'],['심사와 확정 구분','자료 제출과 심사 결과 확정을 다른 상태로 안내합니다.'],['누락 확인','설명·의사·동의·서류 등 필요한 항목이 갖춰졌는지 확인합니다.']],case:'가상 청약 질문은 최근 검사 여부를 묻습니다. 고객이 “검사는 받았지만 대수롭지 않았어요”라고 말합니다.',q:'어떻게 처리할까요?',o:['대수롭지 않으면 없다고 기재한다','질문 기준과 실제 검사 내용을 확인해 정확하게 응답하도록 돕는다','설계사가 판단해 삭제한다'],a:1,f:['중요도에 대한 느낌만으로 질문의 응답을 바꾸지 않습니다.','질문에 맞는 사실을 확인하고 불명확한 부분은 확인 절차로 연결합니다.','고객의 응답을 임의로 변경하면 안 됩니다.'],transfer:'청약 서류 제출은 끝났지만 심사 결과가 나오지 않았습니다.',tq:'고객에게 알릴 상태는?',to:['가입과 보장이 모두 확정','자료 제출 완료 · 심사 결과 확인 필요','추가 확인은 절대 없음'],ta:1,tf:'제출 완료를 인수나 보장 확정과 혼동하지 않도록 안내합니다.'},
14:{c:[['문의 내용 파악','어떤 사건으로 어떤 도움을 원하는지 확인합니다.'],['접수와 지급 구분','서류 접수, 추가 자료 요청, 심사, 지급 결과를 다른 상태로 안내합니다.'],['다음 행동 안내','누가 무엇을 언제 확인할지 정리하고 고객이 진행 상황을 알 수 있게 합니다.']],case:'고객이 청구 서류를 보낸 뒤 “그러면 내일 입금되나요?”라고 묻습니다. 아직 접수 확인도 받지 못했습니다.',q:'어떤 안내가 적절할까요?',o:['내일 입금을 보장한다','접수 여부와 추가 자료 필요 여부부터 확인해 안내한다','서류를 보냈으니 지급 완료로 기록한다'],a:1,f:['접수·심사 상태를 모르는 상황에서 지급 시점을 확정하지 않습니다.','현재 확인 가능한 단계와 다음 확인 행동을 구분합니다.','서류 전달과 지급 완료는 다른 사실입니다.'],transfer:'가상 접수 내역에 추가 진단 자료 요청이 표시됐습니다.',tq:'다음 행동은?',to:['지급 거절로 단정한다','요청 자료·제출 경로·이후 확인 절차를 안내한다','이미 제출했으니 무시한다'],ta:1,tf:'추가 자료 요청의 의미와 필요한 행동을 구체적으로 안내합니다.'}
};
const M=[

function bind(){main.querySelectorAll('[data-ha]').forEach(b=>b.onclick=()=>go(b.dataset.ha));main.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{concept=Number(b.dataset.concept);saveCore();core()});main.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{pick=Number(b.dataset.pick);checked=false;msg=null;saveCore();core()});main.querySelectorAll('[data-transfer]').forEach(b=>b.onclick=()=>{transfer=Number(b.dataset.transfer);checked=false;msg=null;saveCore();core()});main.querySelectorAll('[data-missionchoice]').forEach(b=>b.onclick=()=>{const r=root.missionRecords[id];r.choice=Number(b.dataset.missionchoice);r.response=null;mission()});const c=main.querySelector('[data-missionconfirm]');if(c)c.onchange=()=>{root.missionRecords[id].confirm=c.checked;main.querySelector('[data-ha=missionSubmit]').disabled=!c.checked};main.querySelectorAll('[data-prepcheck]').forEach(e=>e.onchange=()=>{prepChecks[id][Number(e.dataset.prepcheck)]=e.checked;root.prepStates[id]=prepChecks[id].every(Boolean);root.prepCompleted=Object.values(root.prepStates).filter(Boolean).length;prep()});main.querySelectorAll('[data-fieldchoice]').forEach(b=>b.onclick=()=>{field[id]={...(field[id]||{}),choice:Number(b.dataset.fieldchoice)};msg=null;fieldView()});const fc=main.querySelector('[data-fielddone]');if(fc)fc.onchange=()=>{field[id]={...(field[id]||{}),done:fc.checked};main.querySelector('[data-ha=fieldSave]').disabled=!fc.checked||field[id].choice==null}}
function recount(){root.approvedMissions=Object.values(root.missionRecords).filter(r=>r.status==='검토 완료').length}
function go(a){if(a==='home'){if(view==='core')saveCore();root.showHome();return}if(a==='missions'){root.showHome('mission');return}if(a==='prepHome'){root.showHome('prep');return}if(a==='fieldHome'){root.showHome('field');return}if(a==='extraHome'){root.showHome('extra');return}if(a==='fieldSave'){const f=field[id];if(f?.choice==null||!f.done)return;f.saved=true;msg={ok:true,text:'활동을 선택했습니다. 아래 저장 버튼으로 기록을 보관하세요. 실제 동행과 역할 연습의 구분을 유지합니다.'};fieldView();return}
if(view==='core'){const r=root.courseRecords[id],d=D[id];if(a==='prevConcept')concept=Math.max(0,concept-1);if(a==='nextConcept'){if(concept<2)concept++;else{step=1;checked=false;msg=null}}if(a==='concepts'){step=0;msg=null;checked=false}if(a==='practice'){step=1;msg=null;checked=false}if(a==='check'&&pick!==null){r.tries++;checked=pick===d.a;if(!checked)r.errors++;msg={ok:checked,text:d.f[pick]}}if(a==='transfer'&&checked){step=2;checked=false;msg=null}if(a==='checkTransfer'&&transfer!==null){r.tries++;checked=transfer===d.ta;if(!checked)r.errors++;msg={ok:checked,text:checked?d.tf:'사례의 조건과 확인된 정보를 다시 살펴보세요. '+d.tf}}if(a==='finish'&&checked){root.pendingSubmit=true;step=3;r.status='학습 완료';msg=null}if(a==='retry'){step=0;concept=0;pick=null;transfer=null;checked=false;msg=null;r.status='학습 중';r.tries=0;r.errors=0}saveCore();core();return}
if(view==='mission'){const r=root.missionRecords[id],x=M[id].steps[r.cursor];if(a==='missionCheck'&&r.choice!==null){r.response=r.choice;r.tries++;if(r.choice!==x[3])r.errors++}if(a==='missionNext'&&r.choice===x[3]&&r.response===x[3]){r.answers[r.cursor]=r.choice;if(r.cursor===2){r.status='제출 준비';r.confirm=false}else{r.cursor++;r.choice=null;r.response=null}}if(a==='missionSubmit'&&r.confirm&&r.answers.length===3){root.pendingSubmit=true;r.status='제출됨';r.history.push('제출됨')}if(false){r.status='보완 필요';r.feedback=['고객이 정리하고 싶은 이유를 추측하지 않고 질문으로 확인하는 장면을 다시 연습해 주세요.','비용 차이와 보장 조건 차이를 함께 설명하는 장면을 다시 연습해 주세요.','청약 질문에 대한 사실 확인과 심사 판단을 구분하는 장면을 다시 연습해 주세요.'][id];r.history[r.history.length-1]='보완 필요'}if(false){r.status='검토 완료';r.history[r.history.length-1]='검토 완료'}if(a==='missionRevise'){r.status='진행 중';r.cursor=1;r.choice=null;r.response=null;r.confirm=false}recount();mission()}}
root.showHome();
})();
</script>
<div id="serverbar"><button id="save">학습 중 저장</button><button id="refresh">저장된 기록 다시 불러오기</button><div id="servermsg" role="status">저장소 연결 중…</div></div><script src="bridge.js"></script></body></html>
