# Streamlit Community Cloud > App settings > Secrets
# 실제 비밀번호와 API 키는 저장소에 커밋하지 마세요.

# HWARANG WORKSPACE app (app.py)
[passwords]
Admin = "CHANGE_ME"
Manager1 = "CHANGE_ME"
Basic = "CHANGE_ME"
Crew = "CHANGE_ME"
Dream = "CHANGE_ME"

[external_apps]
calculator_url = "https://hwarang-calculator.streamlit.app"
# 현재 운영 Secrets의 대문자 키도 지원합니다.
ACADEMY_URL = "https://hwarang-academy.streamlit.app/"

# HWARANG ACADEMY app (academy_app.py)
# 실제 값은 Academy 앱의 Streamlit Secrets에만 저장합니다.
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CHANGE_ME"
SUPABASE_SECRET_KEY = "sb_secret_CHANGE_ME"

[academy]
public_url = "https://hwarang-academy.streamlit.app/"

# 로컬/개발 중 인증 우회가 꼭 필요할 때만 true로 설정합니다.
# 실제 배포에서는 false 또는 미설정을 권장합니다.
ACADEMY_ALLOW_DEV_BYPASS = false
