# Streamlit Community Cloud > App settings > Secrets
# 실제 API 키/비밀번호는 저장소에 커밋하지 마세요.

# ---------------------------------------------------------
# HWARANG 공통 계정
# WORKSPACE / CALCULATOR / ACADEMY 세 앱에 동일한 Supabase 프로젝트 값을 설정합니다.
# 세 앱 모두 HWARANG 통합 인증과 권한 검증에 사용합니다.
# ---------------------------------------------------------
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CHANGE_ME"
SUPABASE_SECRET_KEY = "sb_secret_CHANGE_ME"

# ---------------------------------------------------------
# 별도 배포 앱 주소
# WORKSPACE: academy_url / calculator_url 사용
# CALCULATOR / ACADEMY: workspace_url 사용
# ---------------------------------------------------------

# ---------------------------------------------------------
# BRIEFING ENGINE (Phase B+)
# 실제 키는 저장소에 커밋하지 마세요.
# Scheduler/GitHub Actions에서도 동일 이름의 Secret을 사용합니다.
# ---------------------------------------------------------
OPENAI_API_KEY = "sk_CHANGE_ME"
BRIEFING_DISCOVERY_MODEL = "gpt-6-luna"

[external_apps]
workspace_url = "https://hwarang-workspace.streamlit.app"
calculator_url = "https://hwarang-calculator.streamlit.app"
academy_url = "https://hwarang-academy.streamlit.app"

# ACADEMY component가 자신의 공개 주소를 만들 때 사용합니다.
[academy]
public_url = "https://hwarang-academy.streamlit.app/"
